

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Reset Password | GlobalBridgeFunding</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      padding: 24px;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #f5f8fc;

      color: #172033;

      font-family: Arial, Helvetica, sans-serif;

    }

    .card {

      width: 100%;

      max-width: 440px;

      padding: 30px;

      border-radius: 16px;

      background: white;

      box-shadow: 0 10px 35px rgba(20,40,70,.10);

    }

    .logo {

      margin-bottom: 26px;

      color: #071a35;

      font-size: 22px;

      font-weight: 800;

    }

    .logo span { color: #36c2ff; }

    h1 { margin: 0 0 10px; color: #071a35; font-size: 27px; }

    p { color: #667085; line-height: 1.6; font-size: 14px; }

    label {

      display: block;

      margin: 20px 0 7px;

      font-size: 14px;

      font-weight: 700;

    }

    input {

      width: 100%;

      padding: 14px;

      border: 1px solid #d6dee9;

      border-radius: 8px;

      font-size: 16px;

    }

    input:focus { outline: 2px solid #36c2ff; }

    button {

      width: 100%;

      margin-top: 24px;

      padding: 15px;

      border: 0;

      border-radius: 8px;

      background: #36c2ff;

      color: #071a35;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

    }

    button:disabled { opacity: .6; cursor: not-allowed; }

    #message {

      display: none;

      margin-top: 18px;

      padding: 12px;

      border-radius: 7px;

      font-size: 14px;

      line-height: 1.5;

      overflow-wrap: anywhere;

    }

    #message.error { display: block; background: #fff1f1; color: #a42626; }

    #message.success { display: block; background: #eef8fc; color: #24566b; }

    .back { display: block; margin-top: 20px; text-align: center; color: #087ea4; text-decoration: none; }

  </style>

</head>

<body>

  <main class="card">

    <div class="logo">Global<span>Bridge</span>Funding</div>

    <h1>Create a new password</h1>

    <p>Enter your new password twice. Use at least 8 characters.</p>

    <form id="resetForm">

      <label for="newPassword">New password</label>

      <input id="newPassword" type="password" autocomplete="new-password"

             minlength="8" required placeholder="Enter new password">

      <label for="confirmPassword">Confirm new password</label>

      <input id="confirmPassword" type="password" autocomplete="new-password"

             minlength="8" required placeholder="Enter password again">

      <button id="saveButton" type="submit">Save new password</button>

      <div id="message" role="status" aria-live="polite"></div>

    </form>

    <a class="back" href="login.html">Return to sign in</a>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL = "https://siykgexfdsmkiqwyxker.supabase.co";

    const SUPABASE_KEY = "sb_publishable_z2GEofJ5eZlSk88IVCjLNg_bmjt6xe6";

    const supabaseClient = window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_KEY,

      {

        auth: {

          detectSessionInUrl: true,

          persistSession: true,

          autoRefreshToken: true

        }

      }

    );

    const form = document.getElementById("resetForm");

    const saveButton = document.getElementById("saveButton");

    const message = document.getElementById("message");

    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

    }

    let recoveryReady = false;

    async function prepareRecovery() {

      const url = new URL(window.location.href);

      const queryError = url.searchParams.get("error_description");

      const hashParams = new URLSearchParams(url.hash.slice(1));

      const hashError = hashParams.get("error_description");

      if (queryError || hashError) {

        showMessage(

          decodeURIComponent((queryError || hashError).replace(/\+/g, " ")),

          "error"

        );

        saveButton.disabled = true;

        return;

      }

      try {

        // Handle PKCE recovery links containing a one-time code.

        const code = url.searchParams.get("code");

        if (code) {

          const { error } = await supabaseClient.auth.exchangeCodeForSession(code);

          if (error) throw error;

        }

        // Wait for Supabase to detect and restore a recovery session from the link.

        const { data, error } = await supabaseClient.auth.getSession();

        if (error) throw error;

        if (data.session) {

          recoveryReady = true;

          return;

        }

        showMessage(

          "This recovery link is invalid, expired, or already used. Return to sign in and request a new password-reset email.",

          "error"

        );

        saveButton.disabled = true;

      } catch (error) {

        console.error("Recovery session error:", error);

        showMessage(

          "We could not verify this recovery link. Request a new password-reset email and open the newest link.",

          "error"

        );

        saveButton.disabled = true;

      }

    }

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      if (!recoveryReady) {

        showMessage(

          "Your recovery link has not been verified. Request a new password-reset email.",

          "error"

        );

        return;

      }

      const newPassword = document.getElementById("newPassword").value;

      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword.length < 8) {

        showMessage("Your password must contain at least 8 characters.", "error");

        return;

      }

      if (newPassword !== confirmPassword) {

        showMessage("The passwords do not match. Please check them.", "error");

        return;

      }

      saveButton.disabled = true;

      saveButton.textContent = "Saving password...";

      try {

        const { data, error } = await supabaseClient.auth.updateUser({

          password: newPassword

        });

        if (error) throw error;

        if (!data.user) throw new Error("The password update could not be confirmed.");

        showMessage(

          "Your password has been changed successfully. You can now return to sign in with your new password.",

          "success"

        );

        form.reset();

        recoveryReady = false;

        // End the recovery session after the password is successfully changed.

        await supabaseClient.auth.signOut();

        saveButton.textContent = "Password updated";

      } catch (error) {

        console.error("Password update error:", error);

        showMessage(

          error.message || "Unable to update your password. Request a new recovery link and try again.",

          "error"

        );

        saveButton.disabled = false;

        saveButton.textContent = "Save new password";

      }

    });

    prepareRecovery();

  </script>

</body>

</html>
