

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sign In | GlobalBridgeFunding</title>

  <script src="language.js"></script>

  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      font-family: Arial, Helvetica, sans-serif;

      background: #f5f8fc;

      color: #172033;

      min-height: 100vh;

    }

    header {

      background: #071a35;

      padding: 18px 6%;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

    }

    .logo { color: white; font-size: 21px; font-weight: 800; }

    .logo span { color: #36c2ff; }

    .header-right {

      display: flex;

      align-items: center;

      gap: 15px;

    }

    .back { color: white; text-decoration: none; font-size: 14px; }

    .language-box select {

      background: white;

      color: #071a35;

      border: none;

      border-radius: 7px;

      padding: 8px 10px;

      font-size: 13px;

      cursor: pointer;

    }

    .container {

      max-width: 500px;

      margin: 55px auto;

      padding: 0 20px;

    }

    .card {

      background: white;

      padding: 36px;

      border-radius: 16px;

      box-shadow: 0 10px 35px rgba(20, 40, 70, .10);

    }

    h1 { color: #071a35; font-size: 30px; margin-bottom: 8px; }

    .intro {

      color: #667085;

      font-size: 15px;

      margin-bottom: 28px;

      line-height: 1.5;

    }

    .field { margin-bottom: 20px; }

    label {

      display: block;

      font-size: 14px;

      font-weight: 700;

      margin-bottom: 7px;

      color: #24344d;

    }

    input {

      width: 100%;

      padding: 14px;

      border: 1px solid #d6dee9;

      border-radius: 8px;

      font-size: 15px;

      outline: none;

    }

    input:focus { border-color: #36c2ff; }

    .forgot {

      text-align: right;

      margin-top: -10px;

      margin-bottom: 24px;

    }

    .forgot a, .create a {

      color: #087ea4;

      text-decoration: none;

    }

    .forgot a { font-size: 13px; }

    button {

      width: 100%;

      border: none;

      background: #36c2ff;

      color: #071a35;

      padding: 15px;

      border-radius: 8px;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

    }

    button:disabled { opacity: .7; cursor: not-allowed; }

    .divider {

      display: flex;

      align-items: center;

      gap: 12px;

      margin: 25px 0;

      color: #98a2b3;

      font-size: 13px;

    }

    .divider::before, .divider::after {

      content: "";

      height: 1px;

      background: #e1e7ef;

      flex: 1;

    }

    .create { text-align: center; color: #667085; font-size: 14px; }

    .create a { font-weight: 700; }

    .notice {

      background: #eef8fc;

      border-left: 4px solid #36c2ff;

      padding: 12px;

      margin-bottom: 23px;

      font-size: 13px;

      color: #536477;

      line-height: 1.5;

    }

    .message {

      display: none;

      margin-top: 18px;

      padding: 12px;

      border-radius: 7px;

      font-size: 13px;

      line-height: 1.5;

    }

    .message.error {

      display: block;

      background: #fff1f1;

      color: #a42626;

      border-left: 4px solid #d64545;

    }

    footer {

      text-align: center;

      padding: 25px;

      color: #7b8797;

      font-size: 12px;

    }

    html[dir="rtl"] body { direction: rtl; }

    html[dir="rtl"] .forgot { text-align: left; }

    html[dir="rtl"] .notice {

      border-left: none;

      border-right: 4px solid #36c2ff;

    }

    html[dir="rtl"] .message.error {

      border-left: none;

      border-right: 4px solid #d64545;

    }

    @media (max-width: 600px) {

      header { padding: 15px 5%; }

      .header-right { gap: 9px; }

      .back { font-size: 12px; }

      .language-box select { padding: 7px 6px; font-size: 11px; }

      .logo { font-size: 17px; }

    }

    @media (max-width: 500px) {

      .card { padding: 27px 21px; }

      h1 { font-size: 27px; }

    }

  </style>

</head>

<body>

    <div class="logo">Global<span>Bridge</span>Funding</div>

    <div class="header-right">

      <div class="language-box">

        <select id="languageSelector"

                data-language-selector="true"

                aria-label="Language">

          <option value="en">English</option>

          <option value="pt">Português</option>

          <option value="vi">Tiếng Việt</option>

          <option value="fa">فارسی</option>

          <option value="id">Bahasa Indonesia</option>

          <option value="fr">Français</option>

          <option value="fi">Suomi</option>

          <option value="es">Español</option>

        </select>

      </div>

      <a href="index.html" class="back" data-key="backHome">← Back to Home</a>

    </div>

  </header>

  <main class="container">

    <div class="card">

      <h1 data-key="title">Welcome back</h1>

      <p class="intro" data-key="intro">

        Sign in to access your GlobalBridgeFunding account.

      </p>

      <div class="notice" data-key="notice">

        Use the email address associated with your account.

      </div>

      <form id="loginForm">

        <div class="field">

          <label for="email" data-key="emailLabel">Email address</label>

          <input type="email" id="email"

                 placeholder="you@example.com"

                 data-placeholder="emailPlaceholder"

                 autocomplete="email" required>

        </div>

        <div class="field">

          <label for="password" data-key="passwordLabel">Password</label>

          <input type="password" id="password"

                 placeholder="Enter your password"

                 data-placeholder="passwordPlaceholder"

                 autocomplete="current-password" required>

        </div>

        <div class="forgot">

          <a href="#" id="forgotLink" data-key="forgot">Forgot your password?</a>

        </div>

        <button type="submit" id="loginButton" data-key="signIn">Sign In</button>

        <div id="message" class="message" role="alert" aria-live="polite"></div>

      </form>

      <div class="divider"><span data-key="or">OR</span></div>

      <div class="create">

        <span data-key="noAccount">Don't have an account?</span>

        <a href="register.html" data-key="createAccount">Create an account</a>

      </div>

    </div>

  </main>

  <footer data-key="footer">

    © 2026 GlobalBridgeFunding. All rights reserved.

  </footer>

    function getSavedLanguage() {

      if (window.GlobalBridgeLanguage &&

          typeof window.GlobalBridgeLanguage.getLanguage === "function") {

        return window.GlobalBridgeLanguage.getLanguage();

      }

      return localStorage.getItem("globalbridge_language") ||

             localStorage.getItem("selectedLanguage") || "en";

    }

    function applyLoginLanguage(language) {

      if (!loginTranslations[language]) language = "en";

      if (window.GlobalBridgeLanguage &&

          typeof window.GlobalBridgeLanguage.setLanguage === "function") {

        window.GlobalBridgeLanguage.setLanguage(language);

      } else {

        localStorage.setItem("globalbridge_language", language);

        localStorage.setItem("selectedLanguage", language);

      }

      document.documentElement.lang = language;

      document.documentElement.dir = language === "fa" ? "rtl" : "ltr";

      const translations = loginTranslations[language];

      document.querySelectorAll("[data-key]").forEach(element => {

        const key = element.getAttribute("data-key");

        if (translations[key] !== undefined) {

          element.textContent = translations[key];

        }

      });

      document.querySelectorAll("[data-placeholder]").forEach(element => {

        const key = element.getAttribute("data-placeholder");

        if (translations[key] !== undefined) {

          element.placeholder = translations[key];

        }

      });

      const selector = document.getElementById("languageSelector");

      if (selector) selector.value = language;

    }

    document.addEventListener("DOMContentLoaded", function () {

      const selector = document.getElementById("languageSelector");

      applyLoginLanguage(getSavedLanguage());

      if (selector) {

        selector.addEventListener("change", function () {

          applyLoginLanguage(this.value);

        });

      }

    });

    const SUPABASE_URL = "https://siykgexfdsmkiqwyxker.supabase.co";

    const SUPABASE_KEY = "sb_publishable_z2GEofJ5eZlSk88IVCjLNg_bmjt6xe6";

    const supabaseClient = window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_KEY

    );

    const loginForm = document.getElementById("loginForm");

    const loginButton = document.getElementById("loginButton");

    const message = document.getElementById("message");

    function showError(text) {

      message.className = "message error";

      message.textContent = text;

    }

    loginForm.addEventListener("submit", async function (event) {

      event.preventDefault();

      message.className = "message";

      message.textContent = "";

      const email = document.getElementById("email").value.trim();

      const password = document.getElementById("password").value;

      const translations = loginTranslations[getSavedLanguage()] || loginTranslations.en;

      loginButton.disabled = true;

      loginButton.textContent = translations.signingIn;

      try {

        const result = await supabaseClient.auth.signInWithPassword({

          email,

          password

        });

        if (result.error || !result.data?.user) {

          showError(result.error?.message || translations.loginError);

          loginButton.disabled = false;

          loginButton.textContent = translations.signIn;

          return;

        }

        const user = result.data.user;

        // Check the authenticated user's ID against the admin_users table.

        const adminCheck = await supabaseClient

          .from("admin_users")

          .select("user_id")

          .eq("user_id", user.id)

          .maybeSingle();

        if (adminCheck.error) {

          console.error("Admin verification failed:", adminCheck.error);

          showError(translations.adminCheckError);

          loginButton.disabled = false;

          loginButton.textContent = translations.signIn;

          return;

        }

        if (adminCheck.data) {

          window.location.replace("admin.html");

          return;

        }

        window.location.replace("dashboard.html");

      } catch (error) {

        console.error("Login error:", error);

        showError(translations.generalError);

        loginButton.disabled = false;

        loginButton.textContent = translations.signIn;

      }

    });

    // Password recovery uses Supabase's configured recovery email flow.

    document.getElementById("forgotLink").addEventListener("click", async function (event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      const translations = loginTranslations[getSavedLanguage()] || loginTranslations.en;

      if (!email) {

        showError(translations.enterEmail);

        document.getElementById("email").focus();

        return;

      }

      message.className = "message";

      message.textContent = "";

      try {

        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {

          redirectTo: window.location.origin + "/login.html"

        });

        if (error) {

          console.error("Password recovery error:", error);

          showError(translations.resetError);

          return;

        }

        message.className = "message";

        message.style.display = "block";

        message.style.background = "#eef8fc";

        message.style.color = "#24566b";

        message.textContent = translations.resetSent;

      } catch (error) {

        console.error("Password recovery error:", error);

        showError(translations.resetError);

      }

    });

  </script>
