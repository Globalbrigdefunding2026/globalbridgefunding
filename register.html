<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | GlobalBridgeFunding</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f5f8fc; color: #172033; min-height: 100vh; }
    header { background: #071a35; padding: 18px 6%; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .logo { color: white; font-size: 21px; font-weight: 800; white-space: nowrap; }
    .logo span { color: #36c2ff; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .back { color: white; text-decoration: none; font-size: 14px; white-space: nowrap; }
    .language-selector { padding: 7px 9px; border-radius: 7px; border: 1px solid rgba(255,255,255,.35); background: white; color: #071a35; font-size: 13px; cursor: pointer; }
    .container { max-width: 520px; margin: 45px auto; padding: 0 20px; }
    .card { background: white; padding: 35px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    h1 { font-size: 26px; margin-bottom: 8px; }
    .subtitle { color: #64748b; margin-bottom: 25px; font-size: 15px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    button { width: 100%; padding: 14px; background: #36c2ff; color: #071a35; border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 8px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-link { text-align: center; margin-top: 18px; font-size: 14px; }
    .login-link a { color: #36c2ff; font-weight: 600; }
    .terms { font-size: 13px; color: #64748b; margin: 12px 0; }
    .terms input { width: auto; margin-right: 6px; }
  </style>
</head>
<body>

<header>
  <div class="logo">Global<span>Bridge</span>Funding</div>
  <div class="header-right">
    <a href="index.html" class="back">← Back to Home</a>
    <select id="languageSelector" class="language-selector">
      <option value="en">English</option>
      <option value="pt">Português</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="fa">فارسی</option>
    </select>
  </div>
</header>

<div class="container">
  <div class="card">
    <h1 id="pageTitle">Create Account</h1>
    <p class="subtitle" id="pageSubtitle">Join GlobalBridgeFunding to apply for financing.</p>

    <form id="registerForm">
      <div class="form-group">
        <label id="labelFirstName">First name</label>
        <input type="text" id="firstName" required>
      </div>
      <div class="form-group">
        <label id="labelLastName">Last name</label>
        <input type="text" id="lastName" required>
      </div>
      <div class="form-group">
        <label id="labelEmail">Email address</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label id="labelCountry">Country</label>
        <input type="text" id="country" required>
      </div>
      <div class="form-group">
        <label id="labelPhone">Phone number</label>
        <input type="tel" id="phone">
      </div>
      <div class="form-group">
        <label id="labelPreferredLanguage">Preferred language</label>
        <select id="language">
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="fa">فارسی</option>
        </select>
      </div>
      <div class="form-group">
        <label id="labelPassword">Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="form-group">
        <label id="labelConfirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" required>
      </div>
      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms" id="labelTerms">I agree to the applicable terms and acknowledge that submitted information may be reviewed as part of the application process.</label>
      </div>
      <button type="submit" id="registerButton">Create Account</button>
    </form>

    <div class="login-link">
      <span id="alreadyHaveAccount">Already have an account?</span> <a href="login.html" id="signInLink">Sign in</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = "https://siykgexfdsmkiqwyxker.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpeWtnZXhmZHNta2lxd3l4a2VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDM0NjEsImV4cCI6MjEwNjcxOTQ2MX0._1aN7LbUWQ_pk5U7jfKn6V9lYV0NyK_Cmg-lAZRQU2c";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

const translations = {
  en: {
    pageTitle: "Create Account",
    pageSubtitle: "Join GlobalBridgeFunding to apply for financing.",
    labelFirstName: "First name",
    labelLastName: "Last name",
    labelEmail: "Email address",
    labelCountry: "Country",
    labelPhone: "Phone number",
    labelPreferredLanguage: "Preferred language",
    labelPassword: "Password",
    labelConfirmPassword: "Confirm password",
    labelTerms: "I agree to the applicable terms and acknowledge that submitted information may be reviewed as part of the application process.",
    registerButton: "Create Account",
    alreadyHaveAccount: "Already have an account?",
    signInLink: "Sign in"
  },
  pt: {
    pageTitle: "Criar Conta",
    pageSubtitle: "Junte-se à GlobalBridgeFunding para solicitar financiamento.",
    labelFirstName: "Nome",
    labelLastName: "Sobrenome",
    labelEmail: "Endereço de e-mail",
    labelCountry: "País",
    labelPhone: "Número de telefone",
    labelPreferredLanguage: "Idioma preferido",
    labelPassword: "Senha",
    labelConfirmPassword: "Confirmar senha",
    labelTerms: "Concordo com os termos aplicáveis e reconheço que as informações enviadas podem ser analisadas como parte do processo de candidatura.",
    registerButton: "Criar Conta",
    alreadyHaveAccount: "Já tem uma conta?",
    signInLink: "Entrar"
  },
  fr: {
    pageTitle: "Créer un compte",
    pageSubtitle: "Rejoignez GlobalBridgeFunding pour demander un financement.",
    labelFirstName: "Prénom",
    labelLastName: "Nom",
    labelEmail: "Adresse e-mail",
    labelCountry: "Pays",
    labelPhone: "Numéro de téléphone",
    labelPreferredLanguage: "Langue préférée",
    labelPassword: "Mot de passe",
    labelConfirmPassword: "Confirmer le mot de passe",
    labelTerms: "J'accepte les conditions applicables et reconnais que les informations soumises peuvent être examinées dans le cadre du processus de demande.",
    registerButton: "Créer un compte",
    alreadyHaveAccount: "Vous avez déjà un compte ?",
    signInLink: "Se connecter"
  },
  es: {
    pageTitle: "Crear cuenta",
    pageSubtitle: "Únete a GlobalBridgeFunding para solicitar financiación.",
    labelFirstName: "Nombre",
    labelLastName: "Apellido",
    labelEmail: "Dirección de correo electrónico",
    labelCountry: "País",
    labelPhone: "Número de teléfono",
    labelPreferredLanguage: "Idioma preferido",
    labelPassword: "Contraseña",
    labelConfirmPassword: "Confirmar contraseña",
    labelTerms: "Acepto los términos aplicables y reconozco que la información enviada puede ser revisada como parte del proceso de solicitud.",
    registerButton: "Crear cuenta",
    alreadyHaveAccount: "¿Ya tienes una cuenta?",
    signInLink: "Iniciar sesión"
  },
  fa: {
    pageTitle: "ایجاد حساب",
    pageSubtitle: "برای درخواست تأمین مالی به GlobalBridgeFunding بپیوندید.",
    labelFirstName: "نام",
    labelLastName: "نام خانوادگی",
    labelEmail: "آدرس ایمیل",
    labelCountry: "کشور",
    labelPhone: "شماره تلفن",
    labelPreferredLanguage: "زبان ترجیحی",
    labelPassword: "رمز عبور",
    labelConfirmPassword: "تأیید رمز عبور",
    labelTerms: "من با شرایط قابل اجرا موافقم و تأیید می‌کنم که اطلاعات ارسال‌شده ممکن است به‌عنوان بخشی از فرآیند درخواست بررسی شود.",
    registerButton: "ایجاد حساب",
    alreadyHaveAccount: "قبلاً حساب دارید؟",
    signInLink: "ورود"
  }
};

function applyLanguage(lang) {
  const t = translations[lang] || translations.en;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "fa") ? "rtl" : "ltr";
  localStorage.setItem("globalbridge_language", lang);

  document.getElementById("pageTitle").textContent = t.pageTitle;
  document.getElementById("pageSubtitle").textContent = t.pageSubtitle;
  document.getElementById("labelFirstName").textContent = t.labelFirstName;
  document.getElementById("labelLastName").textContent = t.labelLastName;
  document.getElementById("labelEmail").textContent = t.labelEmail;
  document.getElementById("labelCountry").textContent = t.labelCountry;
  document.getElementById("labelPhone").textContent = t.labelPhone;
  document.getElementById("labelPreferredLanguage").textContent = t.labelPreferredLanguage;
  document.getElementById("labelPassword").textContent = t.labelPassword;
  document.getElementById("labelConfirmPassword").textContent = t.labelConfirmPassword;
  document.getElementById("labelTerms").textContent = t.labelTerms;
  document.getElementById("registerButton").textContent = t.registerButton;
  document.getElementById("alreadyHaveAccount").textContent = t.alreadyHaveAccount;
  document.getElementById("signInLink").textContent = t.signInLink;

  document.getElementById("languageSelector").value = lang;
}

document.addEventListener("DOMContentLoaded", function() {
  const saved = localStorage.getItem("globalbridge_language") || "en";
  applyLanguage(saved);

  document.getElementById("languageSelector").addEventListener("change", function() {
    applyLanguage(this.value);
  });
});

const registerForm = document.getElementById("registerForm");
const registerButton = document.getElementById("registerButton");

registerForm.addEventListener("submit", async function(e) {
  e.preventDefault();

  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const email = document.getElementById("email").value.trim();
  const country = document.getElementById("country").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const language = document.getElementById("language").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  registerButton.disabled = true;
  registerButton.textContent = "Creating account...";

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          first_name: firstName,
          last_name: lastName,
          country: country,
          phone: phone,
          preferred_language: language
        }
      }
    });

    if (error) {
      alert("Registration failed: " + error.message);
      registerButton.disabled = false;
      registerButton.textContent = "Create Account";
      return;
    }

    if (data.user) {
      alert("Account created successfully! Please check your email and confirm your account before signing in.");
      registerForm.reset();
    } else {
      alert("Registration submitted. Please check your email.");
    }
  } catch (err) {
    alert("An error occurred: " + err.message);
    console.error(err);
  }

  registerButton.disabled = false;
  registerButton.textContent = "Create Account";
});
</script>

</body>
</html>
