<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Applications | GlobalBridgeFunding</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #172033; }
    header { background: #0b1f3a; color: white; padding: 16px 20px; }
    .header-inner { max-width: 1000px; margin: auto; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px 40px; }
    h1 { font-size: 26px; margin-bottom: 6px; }
    h2 { font-size: 20px; margin: 30px 0 12px; }
    .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 14px; border: 1px solid #e6eaf0; }
    .row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .status { background: #fff4cc; color: #8a5b00; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: 700; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 5px; }
    select, input { width: 100%; padding: 10px; border: 1px solid #d0d5dd; border-radius: 8px; }
    button { background: #0b5cab; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; margin-top: 8px; cursor: pointer; }
    .empty { text-align: center; color: #667085; padding: 20px; }
    .msg { padding: 12px; border-radius: 8px; margin-bottom: 12px; display: none; }
    .error { background: #fee4e2; color: #b42318; }
    .success { background: #dcfae6; color: #067647; }
  </style>
</head>
<body>
<header>
  <div class="header-inner"><strong>GlobalBridgeFunding</strong> — Manage Applications</div>
</header>
<main>
  <h1>Manage Applications</h1>
  <div id="msg" class="msg"></div>
  <div id="apps">Loading applications...</div>

  <h2>Record Disbursement</h2>
  <div class="card">
    <label>Approved Application</label>
    <select id="appSelect"><option value="">Loading...</option></select>
    <label>Amount (USD)</label>
    <input type="number" id="amount" step="0.01">
    <label>Transaction Hash (optional)</label>
    <input type="text" id="hash">
    <button onclick="disburse()">Record Disbursement</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = window.supabase.createClient(
  "https://siykgexfdsmkiqwyxker.supabase.co",
  "sb_publishable_z2GEofJ5eZlSk88IVCjLNg_bmjt6xe6"
);

const msg = document.getElementById("msg");
function show(text, type) {
  msg.className = "msg " + type;
  msg.style.display = "block";
  msg.textContent = text;
  setTimeout(() => msg.style.display = "none", 4000);
}

async function load() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { location.href = "login.html"; return; }

  const { data, error } = await supabase.from("financing_applications").select("*").order("created_at", { ascending: false });
  const container = document.getElementById("apps");

  if (error) {
    container.innerHTML = `<div class="empty">Error: ${error.message}</div>`;
    return;
  }

  if (!data?.length) {
    container.innerHTML = `<div class="empty">No applications found</div>`;
  } else {
    container.innerHTML = data.map(a => `
      <div class="card">
        <div class="row">
          <div><strong>${a.business_name || "—"}</strong><br><small>${a.id}</small></div>
          <div class="status">${a.status || "pending"}</div>
        </div>
        <div>Amount: $${a.requested_amount || 0}</div>
        <label>Status</label>
        <select id="s-${a.id}">
          <option value="pending" ${a.status==="pending"?"selected":""}>Pending</option>
          <option value="approved" ${a.status==="approved"?"selected":""}>Approved</option>
          <option value="rejected" ${a.status==="rejected"?"selected":""}>Rejected</option>
          <option value="disbursed" ${a.status==="disbursed"?"selected":""}>Disbursed</option>
        </select>
        <button onclick="updateStatus('${a.id}')">Save</button>
      </div>
    `).join("");
  }

  const select = document.getElementById("appSelect");
  const approved = (data || []).filter(a => a.status === "approved");
  select.innerHTML = `<option value="">Select approved application</option>` +
    approved.map(a => `<option value="${a.id}" data-amount="${a.requested_amount||0}">${a.business_name||"App"} ($${a.requested_amount||0})</option>`).join("");
}

async function updateStatus(id) {
  const status = document.getElementById("s-" + id).value;
  const { error } = await supabase.from("financing_applications").update({ status }).eq("id", id);
  if (error) show(error.message, "error");
  else { show("Status updated", "success"); load(); }
}

async function disburse() {
  const id = document.getElementById("appSelect").value;
  const amount = document.getElementById("amount").value;
  const hash = document.getElementById("hash").value.trim();
  if (!id || !amount) { show("Select application and amount", "error"); return; }

  const { error } = await supabase.from("loan_disbursements").insert({
    application_id: id,
    amount: parseFloat(amount),
    transaction_hash: hash || null
  });
  if (error) { show(error.message, "error"); return; }

  await supabase.from("financing_applications").update({ status: "disbursed" }).eq("id", id);
  show("Disbursement recorded", "success");
  document.getElementById("amount").value = "";
  document.getElementById("hash").value = "";
  load();
}

document.getElementById("appSelect").addEventListener("change", e => {
  const opt = e.target.selectedOptions[0];
  if (opt?.dataset.amount) document.getElementById("amount").value = opt.dataset.amount;
});

load();
</script>
</body>
</html>
