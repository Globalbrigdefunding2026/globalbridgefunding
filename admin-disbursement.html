<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan Disbursement</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f7fb; }
    .box { background: white; padding: 16px; border-radius: 10px; margin: 10px 0; }
    .error { background: #fee4e2; color: #b42318; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    select, input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
    button { background: #0b5cab; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-top: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Loan Disbursement</h1>
  <div id="log"></div>
  <div id="form" style="display:none;" class="box">
    <label>Approved Application</label>
    <select id="appSelect"></select>
    <label>Amount (USD)</label>
    <input type="number" id="amount" step="0.01">
    <label>Transaction Hash (optional)</label>
    <input type="text" id="hash">
    <button onclick="disburse()">Record Disbursement</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const log = document.getElementById("log");
    function add(msg, isError) {
      const div = document.createElement("div");
      div.className = isError ? "box error" : "box";
      div.textContent = msg;
      log.appendChild(div);
    }

    const supabase = window.supabase.createClient(
      "https://siykgexfdsmkiqwyxker.supabase.co",
      "sb_publishable_z2GEofJ5eZlSk88IVCjLNg_bmjt6xe6"
    );

    async function load() {
      add("Loading approved applications...");
      const { data, error } = await supabase
        .from("financing_applications")
        .select("id, business_name, requested_amount")
        .eq("status", "approved");

      if (error) { add("Error: " + error.message, true); return; }

      add("Found " + (data?.length || 0) + " approved applications.");

      const select = document.getElementById("appSelect");
      select.innerHTML = `<option value="">Select an application</option>` +
        (data || []).map(a => `<option value="${a.id}" data-amount="${a.requested_amount}">${a.business_name} ($${a.requested_amount})</option>`).join("");

      document.getElementById("form").style.display = "block";
    }

    async function disburse() {
      const id = document.getElementById("appSelect").value;
      const amount = document.getElementById("amount").value;
      const hash = document.getElementById("hash").value.trim();

      if (!id || !amount) { add("Please select an application and enter an amount.", true); return; }

      const { error } = await supabase.from("loan_disbursements").insert({
        application_id: id,
        amount: parseFloat(amount),
        transaction_hash: hash || null
      });

      if (error) { add("Disbursement error: " + error.message, true); return; }

      await supabase.from("financing_applications").update({ status: "disbursed" }).eq("id", id);
      add("Disbursement recorded successfully.");
      document.getElementById("amount").value = "";
      document.getElementById("hash").value = "";
      load();
    }

    load();
  </script>
</body>
</html>
