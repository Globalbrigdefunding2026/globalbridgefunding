<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan Disbursement | GlobalBridgeFunding</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #172033; }
    header { background: #0b1f3a; color: white; padding: 16px 20px; }
    .header-inner { max-width: 800px; margin: auto; }
    main { max-width: 800px; margin: 24px auto; padding: 0 16px 40px; }
    h1 { font-size: 26px; margin-bottom: 8px; }
    .card { background: white; border-radius: 12px; padding: 20px; border: 1px solid #e6eaf0; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    select, input { width: 100%; padding: 12px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 15px; }
    button { background: #0b5cab; color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: 700; margin-top: 16px; cursor: pointer; width: 100%; }
    .error { background: #fee4e2; color: #b42318; padding: 12px; border-radius: 8px; margin-bottom: 12px; display: none; }
    .success { background: #dcfae6; color: #067647; padding: 12px; border-radius: 8px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <strong>GlobalBridgeFunding</strong> — Loan Disbursement
  </div>
</header>
<main>
  <h1>Record Loan Disbursement</h1>
  <div id="error" class="error"></div>
  <div id="success" class="success"></div>
  <div class="card">
    <label>Select Approved Application</label>
    <select id="appSelect"><option value="">Loading...</option></select>
    <label>Amount (USD)</label>
    <input type="number" id="amount" step="0.01">
    <label>Transaction Hash (optional)</label>
    <input type="text" id="hash" placeholder="Optional">
    <button onclick="disburse()">Record Disbursement</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = window.supabase.createClient(
  "https://siykgexfdsmkiqwyxker.supabase.co",
  "sb_publishable_z2GEofJ5eZlSk88IVCjLNg_bmjt6xe6"
);

const errorEl = document.getElementById("error");
const successEl = document.getElementById("success");

function showError(msg) { errorEl.style.display = "block"; errorEl.textContent = msg; successEl.style.display = "none"; }
function showSuccess(msg) { successEl.style.display = "block"; successEl.textContent = msg; errorEl.style.display = "none"; }

async function load() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { location.href = "login.html"; return; }

  const { data, error } = await supabase
    .from("financing_applications")
    .select("id, business_name, requested_amount")
    .eq("status", "approved")
    .order("created_at", { ascending: false });

  const select = document.getElementById("appSelect");
  if (error) { select.innerHTML = `<option>Error loading</option>`; showError(error.message); return; }

  select.innerHTML = `<option value="">Select an approved application</option>` +
    (data || []).map(a => `<option value="${a.id}" data-amount="${a.requested_amount}">${a.business_name} ($${a.requested_amount})</option>`).join("");
}

async function disburse() {
  const id = document.getElementById("appSelect").value;
  const amount = document.getElementById("amount").value;
  const hash = document.getElementById("hash").value.trim();

  if (!id || !amount) { showError("Please select an application and enter an amount."); return; }

  const { error } = await supabase.from("loan_disbursements").insert({
    application_id: id,
    amount: parseFloat(amount),
    transaction_hash: hash || null
  });

  if (error) { showError(error.message); return; }

  await supabase.from("financing_applications").update({ status: "disbursed" }).eq("id", id);

  showSuccess("Disbursement recorded successfully.");
  document.getElementById("amount").value = "";
  document.getElementById("hash").value = "";
  load();
}

document.getElementById("appSelect").addEventListener("change", e => {
  const opt = e.target.selectedOptions[0];
  if (opt?.dataset.amount) document.getElementById("amount").value = opt.dataset.amount;
});

load();
</script>
</body>
</html>
