<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Applications | GlobalBridgeFunding</title>
  <script src="language.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f4f7fb; color: #172033; }
    header { background: #0b1f3a; color: white; padding: 18px 20px; }
    .header-inner { max-width: 1100px; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .brand { font-size: 20px; font-weight: 700; }
    .header-right { display: flex; align-items: center; gap: 15px; }
    .admin-label { font-size: 13px; opacity: 0.8; }
    .language-select { border: 1px solid rgba(255,255,255,0.35); background: white; color: #172033; border-radius: 7px; padding: 7px 9px; font-size: 12px; outline: none; }
    main { max-width: 1100px; margin: 30px auto; padding: 0 18px 50px; }
    h1 { font-size: 30px; margin-bottom: 8px; }
    h2 { font-size: 24px; margin: 40px 0 15px; }
    .intro { color: #667085; margin-bottom: 25px; line-height: 1.5; }
    .message { padding: 14px 16px; border-radius: 10px; margin-bottom: 20px; display: none; line-height: 1.5; }
    .error { background: #fee4e2; color: #b42318; }
    .success { background: #dcfae6; color: #067647; }
    .loading { background: white; padding: 25px; border-radius: 14px; text-align: center; color: #667085; }
    .application { background: white; border-radius: 16px; padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 18px rgba(16,24,40,.07); border: 1px solid #e6eaf0; }
    .application-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .reference { font-size: 13px; color: #667085; word-break: break-all; }
    .reference strong { color: #172033; }
    .status { display: inline-block; padding: 7px 12px; border-radius: 20px; background: #fff4cc; color: #8a5b00; font-size: 13px; font-weight: 700; text-transform: capitalize; }
    .details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 22px; }
    .detail { background: #f8fafc; padding: 14px; border-radius: 10px; }
    .detail-label { font-size: 12px; color: #667085; margin-bottom: 5px; }
    .detail-value { font-weight: 600; word-break: break-word; }
    .review-section { border-top: 1px solid #eaecf0; padding-top: 20px; }
    .review-section h3 { font-size: 17px; margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; }
    select, textarea, input { width: 100%; border: 1px solid #d0d5dd; border-radius: 9px; padding: 12px; font-size: 14px; background: white; outline: none; }
    select:focus, textarea:focus, input:focus { border-color: #0b5cab; }
    textarea { min-height: 100px; resize: vertical; margin-bottom: 12px; }
    .review-row { display: grid; grid-template-columns: 220px 1fr; gap: 15px; align-items: end; }
    button { border: none; background: #0b5cab; color: white; padding: 12px 18px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 5px; }
    button:hover { background: #084a8d; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .email-status { margin-top: 12px; font-size: 13px; color: #667085; }
    .empty { background: white; padding: 35px; border-radius: 14px; text-align: center; color: #667085; }
    .empty h3 { margin-bottom: 8px; color: #172033; }
    .disbursement-card { background: white; border-radius: 16px; padding: 22px; margin-top: 10px; border: 1px solid #e6eaf0; }
    html[dir="rtl"] body { direction: rtl; }
    @media (max-width: 700px) {
      h1 { font-size: 25px; }
      .details { grid-template-columns: 1fr; }
      .review-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">GlobalBridgeFunding</div>
    <div class="header-right">
      <div class="admin-label">Administrator Portal</div>
      <select class="language-select" id="languageSelector">
        <option value="en">English</option>
        <option value="fa">فارسی</option>
      </select>
    </div>
  </div>
</header>

<main>
  <h1>Application Review</h1>
  <p class="intro">Review financing applications, KYC submissions, and record loan disbursements.</p>

  <div id="errorMessage" class="message error"></div>
  <div id="successMessage" class="message success"></div>

  <div id="loading" class="loading">Checking administrator access...</div>
  <div id="applications"></div>

  <h2>KYC Review</h2>
  <div id="kycList"><div class="loading">Loading KYC submissions...</div></div>

  <h2>Loan Disbursement</h2>
  <div class="disbursement-card">
    <h3 style="margin-bottom:12px;">Record Disbursement</h3>
    <div class="field" style="margin-bottom:14px;">
      <label>Select Approved Application</label>
      <select id="disbursementApplication"></select>
    </div>
    <div class="field" style="margin-bottom:14px;">
      <label>Disbursement Amount (USD)</label>
      <input type="number" id="disbursementAmount" step="0.01" min="0">
    </div>
    <div class="field" style="margin-bottom:14px;">
      <label>Transaction Hash / Reference</label>
      <input type="text" id="disbursementHash" placeholder="Optional">
    </div>
    <button id="disbursementButton" onclick="recordDisbursement()">Record Disbursement</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://siykgexfdsmkiqwyxker.supabase.co";
const SUPABASE_KEY = "sb_publishable_z2GEofJ5eZlSk88IVCjLNg_bmjt6xe6";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loading = document.getElementById("loading");
const applicationsContainer = document.getElementById("applications");
const errorMessage = document.getElementById("errorMessage");
const successMessage = document.getElementById("successMessage");

function showError(msg) { errorMessage.textContent = msg; errorMessage.style.display = "block"; successMessage.style.display = "none"; }
function showSuccess(msg) { successMessage.textContent = msg; successMessage.style.display = "block"; errorMessage.style.display = "none"; setTimeout(() => successMessage.style.display = "none", 5000); }
function formatMoney(amount) { return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(amount || 0); }
function formatDate(date) { return date ? new Date(date).toLocaleDateString() : "—"; }
function escapeHtml(value) { return value == null ? "" : String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]); }

async function loadAdminApplications() {
  try {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { window.location.href = "login.html"; return; }

    const { data: adminRecord } = await supabaseClient.from("admin_users").select("user_id").eq("user_id", user.id).maybeSingle();
    if (!adminRecord) { showError("Access denied."); loading.style.display = "none"; return; }

    const { data: applications, error } = await supabaseClient.from("financing_applications").select("*").order("created_at", { ascending: false });
    if (error) throw error;

    loading.style.display = "none";
    renderApplications(applications || []);
    loadKYC();
    loadApprovedApplications();
  } catch (err) {
    loading.style.display = "none";
    showError("Failed to load data: " + err.message);
  }
}

function renderApplications(applications) {
  if (!applications.length) {
    applicationsContainer.innerHTML = `<div class="empty"><h3>No applications found</h3></div>`;
    return;
  }
  applicationsContainer.innerHTML = applications.map(app => `
    <div class="application">
      <div class="application-header">
        <div class="reference"><strong>Application ID</strong><br>${escapeHtml(app.id)}</div>
        <div class="status">${escapeHtml(app.status || "pending")}</div>
      </div>
      <div class="details">
        <div class="detail"><div class="detail-label">Requested Amount</div><div class="detail-value">${formatMoney(app.requested_amount)}</div></div>
        <div class="detail"><div class="detail-label">Business Name</div><div class="detail-value">${escapeHtml(app.business_name)}</div></div>
        <div class="detail"><div class="detail-label">Business Type</div><div class="detail-value">${escapeHtml(app.business_type)}</div></div>
        <div class="detail"><div class="detail-label">Submitted</div><div class="detail-value">${formatDate(app.created_at)}</div></div>
      </div>
      <div class="review-section">
        <h3>Review</h3>
        <div class="review-row">
          <div>
            <label>Status</label>
            <select id="status-${app.id}">
              <option value="pending" ${app.status==="pending"?"selected":""}>Pending</option>
              <option value="under_review" ${app.status==="under_review"?"selected":""}>Under Review</option>
              <option value="approved" ${app.status==="approved"?"selected":""}>Approved</option>
              <option value="rejected" ${app.status==="rejected"?"selected":""}>Rejected</option>
            </select>
          </div>
        </div>
        <button onclick="updateApplication('${app.id}')" id="button-${app.id}">Save Review</button>
      </div>
    </div>
  `).join("");
}

async function updateApplication(id) {
  const status = document.getElementById("status-" + id).value;
  const button = document.getElementById("button-" + id);
  button.disabled = true;
  button.textContent = "Saving...";
  try {
    const { error } = await supabaseClient.from("financing_applications").update({ status }).eq("id", id);
    if (error) throw error;
    showSuccess("Application status updated.");
    loadAdminApplications();
  } catch (err) {
    showError(err.message);
  } finally {
    button.disabled = false;
    button.textContent = "Save Review";
  }
}

async function loadKYC() {
  const container = document.getElementById("kycList");
  const { data, error } = await supabaseClient.from("kyc_submissions").select("*").order("created_at", { ascending: false });
  if (error || !data?.length) {
    container.innerHTML = `<div class="empty"><h3>No KYC submissions</h3></div>`;
    return;
  }
  container.innerHTML = data.map(kyc => `
    <div class="application">
      <div class="application-header">
        <div class="reference"><strong>KYC ID</strong><br>${escapeHtml(kyc.id)}</div>
        <div class="status">${escapeHtml(kyc.status || "pending")}</div>
      </div>
      <div class="details">
        <div class="detail"><div class="detail-label">Full Name</div><div class="detail-value">${escapeHtml(kyc.full_name)}</div></div>
        <div class="detail"><div class="detail-label">Document</div><div class="detail-value">${kyc.document_url ? `<a href="${escapeHtml(kyc.document_url)}" target="_blank">View document</a>` : "No document"}</div></div>
      </div>
      <div class="review-section">
        <select id="kyc-status-${kyc.id}">
          <option value="pending" ${kyc.status==="pending"?"selected":""}>Pending</option>
          <option value="approved" ${kyc.status==="approved"?"selected":""}>Approved</option>
          <option value="rejected" ${kyc.status==="rejected"?"selected":""}>Rejected</option>
        </select>
        <button onclick="updateKYC('${kyc.id}')">Save KYC Review</button>
      </div>
    </div>
  `).join("");
}

async function updateKYC(id) {
  const status = document.getElementById("kyc-status-" + id).value;
  const { error } = await supabaseClient.from("kyc_submissions").update({ status }).eq("id", id);
  if (error) showError(error.message);
  else { showSuccess("KYC updated."); loadKYC(); }
}

async function loadApprovedApplications() {
  const select = document.getElementById("disbursementApplication");
  const { data } = await supabaseClient.from("financing_applications").select("id, business_name, requested_amount").eq("status", "approved").order("created_at", { ascending: false });
  select.innerHTML = `<option value="">Select an approved application</option>` + (data || []).map(app => 
    `<option value="${app.id}" data-amount="${app.requested_amount}">${escapeHtml(app.business_name)} — ${formatMoney(app.requested_amount)}</option>`
  ).join("");
}

async function recordDisbursement() {
  const appId = document.getElementById("disbursementApplication").value;
  const amount = document.getElementById("disbursementAmount").value;
  const hash = document.getElementById("disbursementHash").value.trim();
  const button = document.getElementById("disbursementButton");

  if (!appId || !amount) { showError("Please select an application and enter an amount."); return; }

  button.disabled = true;
  button.textContent = "Recording...";

  try {
    const { error } = await supabaseClient.from("loan_disbursements").insert({
      application_id: appId,
      amount: parseFloat(amount),
      transaction_hash: hash || null,
      disbursed_at: new Date().toISOString()
    });
    if (error) throw error;

    await supabaseClient.from("financing_applications").update({ status: "disbursed" }).eq("id", appId);

    showSuccess("Disbursement recorded successfully.");
    document.getElementById("disbursementAmount").value = "";
    document.getElementById("disbursementHash").value = "";
    loadApprovedApplications();
    loadAdminApplications();
  } catch (err) {
    showError("Failed to record disbursement: " + err.message);
  } finally {
    button.disabled = false;
    button.textContent = "Record Disbursement";
