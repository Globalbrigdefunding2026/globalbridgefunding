<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Applications | GlobalBridgeFunding</title>
  <script src="language.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f4f7fb; color: #172033; }
    header { background: #0b1f3a; color: white; padding: 18px 20px; }
    .header-inner { max-width: 1100px; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .brand { font-size: 20px; font-weight: 700; }
    .header-right { display: flex; align-items: center; gap: 15px; }
    .admin-label { font-size: 13px; opacity: 0.8; }
    .language-select { border: 1px solid rgba(255,255,255,0.35); background: white; color: #172033; border-radius: 7px; padding: 7px 9px; font-size: 12px; outline: none; }
    main { max-width: 1100px; margin: 30px auto; padding: 0 18px; }
    h1 { font-size: 30px; margin-bottom: 8px; }
    h2 { font-size: 24px; margin: 40px 0 15px; }
    .intro { color: #667085; margin-bottom: 25px; line-height: 1.5; }
    .message { padding: 14px 16px; border-radius: 10px; margin-bottom: 20px; display: none; line-height: 1.5; }
    .error { background: #fee4e2; color: #b42318; }
    .success { background: #dcfae6; color: #067647; }
    .loading { background: white; padding: 25px; border-radius: 14px; text-align: center; color: #667085; }
    .application { background: white; border-radius: 16px; padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 18px rgba(16,24,40,.07); border: 1px solid #e6eaf0; }
    .application-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .reference { font-size: 13px; color: #667085; word-break: break-all; }
    .reference strong { color: #172033; }
    .status { display: inline-block; padding: 7px 12px; border-radius: 20px; background: #fff4cc; color: #8a5b00; font-size: 13px; font-weight: 700; text-transform: capitalize; }
    .details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 22px; }
    .detail { background: #f8fafc; padding: 14px; border-radius: 10px; }
    .detail-label { font-size: 12px; color: #667085; margin-bottom: 5px; }
    .detail-value { font-weight: 600; word-break: break-word; }
    .review-section { border-top: 1px solid #eaecf0; padding-top: 20px; }
    .review-section h3 { font-size: 17px; margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; }
    select, textarea { width: 100%; border: 1px solid #d0d5dd; border-radius: 9px; padding: 12px; font-size: 14px; background: white; outline: none; }
    select:focus, textarea:focus { border-color: #0b5cab; }
    textarea { min-height: 100px; resize: vertical; margin-bottom: 12px; }
    .review-row { display: grid; grid-template-columns: 220px 1fr; gap: 15px; align-items: end; }
    button { border: none; background: #0b5cab; color: white; padding: 12px 18px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 5px; }
    button:hover { background: #084a8d; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .email-status { margin-top: 12px; font-size: 13px; color: #667085; }
    .empty { background: white; padding: 35px; border-radius: 14px; text-align: center; color: #667085; }
    .empty h3 { margin-bottom: 8px; color: #172033; }
    html[dir="rtl"] body { direction: rtl; }
    html[dir="rtl"] .header-inner, html[dir="rtl"] .application-header, html[dir="rtl"] .review-row { direction: rtl; }
    @media (max-width: 700px) {
      h1 { font-size: 25px; }
      .header-inner { align-items: flex-start; }
      .header-right { flex-direction: column; align-items: flex-end; gap: 8px; }
      .details { grid-template-columns: 1fr; }
      .review-row { grid-template-columns: 1fr; }
      .application { padding: 18px; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">GlobalBridgeFunding</div>
    <div class="header-right">
      <div class="admin-label" data-key="adminPortal">Administrator Portal</div>
      <select class="language-select" id="languageSelector" data-language-selector="true" aria-label="Language">
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="vi">Tiếng Việt</option>
        <option value="fa">فارسی</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="fr">Français</option>
        <option value="fi">Suomi</option>
        <option value="es">Español</option>
      </select>
    </div>
  </div>
</header>

<main>
  <h1 data-key="applicationReview">Application Review</h1>
  <p class="intro" data-key="reviewIntro">Review submitted financing applications and update their current status.</p>

  <div id="errorMessage" class="message error"></div>
  <div id="successMessage" class="message success"></div>

  <div id="loading" class="loading" data-key="checkingAccess">Checking administrator access...</div>
  <div id="applications"></div>

  <h2>KYC Review</h2>
  <div id="kycList">
    <div class="loading">Loading KYC submissions...</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const adminTranslations = {
  en: {
    adminPortal: "Administrator Portal", applicationReview: "Application Review",
    reviewIntro: "Review submitted financing applications and update their current status.",
    checkingAccess: "Checking administrator access...", applicationReference: "Application Reference",
    requestedFinancing: "Requested Financing", businessName: "Business Name", businessType: "Business Type",
    yearsOperation: "Years in Operation", annualRevenue: "Estimated Annual Revenue", submitted: "Submitted",
    financingPurpose: "Financing Purpose", reviewApplication: "Review Application", applicationStatus: "Application Status",
    reviewNote: "Review Note", reviewPlaceholder: "Add an internal review note...", pending: "Pending",
    underReview: "Under Review", approved: "Approved", rejected: "Rejected", saveReview: "Save Review",
    saving: "Saving...", noApplications: "No applications found", noApplicationsText: "There are currently no financing applications to review.",
    unableVerify: "Unable to verify administrator access.", accessDenied: "Access denied. This account is not authorized as an administrator.",
    unableLoad: "Unable to load applications: ", somethingWrong: "Something went wrong while loading the admin page.",
    unableUpdate: "Unable to update application: ", approvedSending: "Application approved. Sending approval email...",
    emailSent: "✓ Approval email sent successfully to the applicant.", approvedEmailSuccess: "Application approved and Persian approval email sent successfully.",
    alreadyApproved: "Application status is already approved. No duplicate email was sent.", statusUpdated: "Application status updated successfully.",
    unauthorizedUpdate: "You are not authorized to update applications.", unableCurrentStatus: "Unable to find the current application status.",
    approvedEmailFailed: "Application was approved, but the approval email could not be sent."
  }
};

const SUPABASE_URL = "https://siykgexfdsmkiqwyxker.supabase.co";
const SUPABASE_KEY = "sb_publishable_z2GEofJ5eZlSk88IVCjLNg_bmjt6xe6";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loading = document.getElementById("loading");
const applicationsContainer = document.getElementById("applications");
const errorMessage = document.getElementById("errorMessage");
const successMessage = document.getElementById("successMessage");
const languageSelector = document.getElementById("languageSelector");

function getSavedLanguage() {
  if (window.GlobalBridgeLanguage && typeof window.GlobalBridgeLanguage.getLanguage === "function") {
    return window.GlobalBridgeLanguage.getLanguage();
  }
  const saved = localStorage.getItem("globalbridge_language");
  return (saved && adminTranslations[saved]) ? saved : "en";
}

function applyAdminLanguage(language) {
  if (!adminTranslations[language]) language = "en";
  document.documentElement.lang = language;
  document.documentElement.dir = language === "fa" ? "rtl" : "ltr";
  if (languageSelector) languageSelector.value = language;
  document.querySelectorAll("[data-key]").forEach(el => {
    const key = el.getAttribute("data-key");
    if (adminTranslations[language][key]) el.textContent = adminTranslations[language][key];
  });
  if (window.adminApplicationsData) renderApplications(window.adminApplicationsData);
}

if (languageSelector) {
  languageSelector.addEventListener("change", function () {
    const selected = this.value;
    if (window.GlobalBridgeLanguage && typeof window.GlobalBridgeLanguage.setLanguage === "function") {
      window.GlobalBridgeLanguage.setLanguage(selected);
    } else {
      localStorage.setItem("globalbridge_language", selected);
    }
    applyAdminLanguage(selected);
  });
}

function showError(message) { errorMessage.textContent = message; errorMessage.style.display = "block"; successMessage.style.display = "none"; }
function showSuccess(message) { successMessage.textContent = message; successMessage.style.display = "block"; errorMessage.style.display = "none"; setTimeout(() => successMessage.style.display = "none", 5000); }
function formatMoney(amount) { return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(amount); }
function formatDate(date) { return new Date(date).toLocaleDateString(); }
function escapeHtml(value) { return value == null ? "" : String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]); }
function translateStatus(status) { const t = adminTranslations[getSavedLanguage()] || adminTranslations.en; return t[status] || status; }

function renderApplications(applications) {
  const t = adminTranslations[getSavedLanguage()] || adminTranslations.en;
  if (!applications || !applications.length) {
    applicationsContainer.innerHTML = `<div class="empty"><h3>${escapeHtml(t.noApplications)}</h3><p>${escapeHtml(t.noApplicationsText)}</p></div>`;
    return;
  }
  applicationsContainer.innerHTML = applications.map(app => `
    <div class="application">
      <div class="application-header">
        <div class="reference"><strong>${escapeHtml(t.applicationReference)}</strong><br>${escapeHtml(app.id)}</div>
        <div class="status">${escapeHtml(translateStatus(app.status))}</div>
      </div>
      <div class="details">
        <div class="detail"><div class="detail-label">${escapeHtml(t.requestedFinancing)}</div><div class="detail-value">${formatMoney(app.requested_amount)}</div></div>
        <div class="detail"><div class="detail-label">${escapeHtml(t.businessName)}</div><div class="detail-value">${escapeHtml(app.business_name)}</div></div>
        <div class="detail"><div class="detail-label">${escapeHtml(t.businessType)}</div><div class="detail-value">${escapeHtml(app.business_type)}</div></div>
        <div class="detail"><div class="detail-label">${escapeHtml(t.yearsOperation)}</div><div class="detail-value">${escapeHtml(app.years_in_operation)}</div></div>
        <div class="detail"><div class="detail-label">${escapeHtml(t.annualRevenue)}</div><div class="detail-value">${escapeHtml(app.annual_revenue)}</div></div>
        <div class="detail"><div class="detail-label">${escapeHtml(t.submitted)}</div><div class="detail-value">${formatDate(app.created_at)}</div></div>
        <div class="detail" style="grid-column:1/-1"><div class="detail-label">${escapeHtml(t.financingPurpose)}</div><div class="detail-value">${escapeHtml(app.financing_purpose)}</div></div>
      </div>
      <div class="review-section">
        <h3>${escapeHtml(t.reviewApplication)}</h3>
        <div class="review-row">
          <div>
            <label for="status-${app.id}">${escapeHtml(t.applicationStatus)}</label>
            <select id="status-${app.id}">
              <option value="pending" ${app.status==="pending"?"selected":""}>${escapeHtml(t.pending)}</option>
              <option value="under_review" ${app.status==="under_review"?"selected":""}>${escapeHtml(t.underReview)}</option>
              <option value="approved" ${app.status==="approved"?"selected":""}>${escapeHtml(t.approved)}</option>
              <option value="rejected" ${app.status==="rejected"?"selected":""}>${escapeHtml(t.rejected)}</option>
            </select>
          </div>
          <div>
            <label for="note-${app.id}">${escapeHtml(t.reviewNote)}</label>
            <textarea id="note-${app.id}" placeholder="${escapeHtml(t.reviewPlaceholder)}"></textarea>
          </div>
        </div>
        <button onclick="updateApplication('${app.id}')" id="button-${app.id}">${escapeHtml(t.saveReview)}</button>
        <div id="email-status-${app.id}" class="email-status"></div>
      </div>
    </div>
  `).join("");
}

async function loadAdminApplications() {
  try {
    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
    if (userError || !user) { window.location.href = "login.html"; return; }

    const { data: adminRecord, error: adminError } = await supabaseClient.from("admin_users").select("user_id").eq("user_id", user.id).maybeSingle();
    if (adminError) { showError(adminTranslations[getSavedLanguage()].unableVerify); loading.style.display = "none"; return; }
    if (!adminRecord) { showError(adminTranslations[getSavedLanguage()].accessDenied); loading.style.display = "none"; return; }

    const { data: applications, error: applicationsError } = await supabaseClient.from("financing_applications").select("*").order("created_at", { ascending: false });
    if (applicationsError) { showError(adminTranslations[getSavedLanguage()].unableLoad + applicationsError.message); loading.style.display = "none"; return; }

    loading.style.display = "none";
    window.adminApplicationsData = applications || [];
    renderApplications(window.adminApplicationsData);
    loadKYC();
  } catch (error) {
    loading.style.display = "none";
    showError(adminTranslations[getSavedLanguage()].somethingWrong);
    console.error(error);
  }
}

async function updateApplication(applicationId) {
  const statusElement = document.getElementById("status-" + applicationId);
  const noteElement = document.getElementById("note-" + applicationId);
  const button = document.getElementById("button-" + applicationId);
  const emailStatus = document.getElementById("email-status-" + applicationId);
  const status = statusElement.value;
  const note = noteElement.value.trim();
  void note;
  const translations = adminTranslations[getSavedLanguage()] || adminTranslations.en;

  button.disabled = true;
  button.textContent = translations.saving;
  emailStatus.textContent = "";

  try {
    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
    if (userError || !user) { window.location.href = "login.html"; return; }

    const { data: adminRecord, error: adminError } = await supabaseClient.from("admin_users").select("user_id").eq("user_id", user.id).maybeSingle();
    if (adminError || !adminRecord) throw new Error(translations.unauthorizedUpdate);

    const { data: currentApplication, error: currentApplicationError } = await supabaseClient.from("financing_applications").select("status").eq("id", applicationId).single();
    if (currentApplicationError || !currentApplication) throw new Error(translations.unableCurrentStatus);

    const wasAlreadyApproved = currentApplication.status === "approved";

    const { error: updateError } = await supabaseClient.from("financing_applications").update({ status }).eq("id", applicationId);
    if (updateError) throw updateError;

    if (status === "approved" && !wasAlreadyApproved) {
      emailStatus.textContent = translations.approvedSending;
      const { data: emailData, error: emailError } = await supabaseClient.functions.invoke("hyper-worker", { body: { action: "approval_email", application_id: applicationId } });
      if (emailError) throw new Error(translations.approvedEmailFailed);
      if (emailData && emailData.error) throw new Error(emailData.error);
      emailStatus.textContent = translations.emailSent;
      showSuccess(translations.approvedEmailSuccess);
    } else if (status === "approved" && wasAlreadyApproved) {
      showSuccess(translations.alreadyApproved);
    } else {
      showSuccess(translations.statusUpdated);
    }

    button.disabled = false;
    button.textContent = translations.saveReview;
    setTimeout(() => loadAdminApplications(), 800);
  } catch (error) {
    console.error(error);
    showError(translations.unableUpdate + error.message);
    button.disabled = false;
    button.textContent = translations.saveReview;
  }
}

async function loadKYC() {
  const kycContainer = document.getElementById("kycList");
  if (!kycContainer) return;
  try {
    const { data, error } = await supabaseClient.from("kyc_submissions").select("*").order("created_at", { ascending: false });
    if (error) throw error;
    if (!data || data.length === 0) {
      kycContainer.innerHTML = `<div class="empty"><h3>No KYC submissions</h3><p>There are currently no KYC records to review.</p></div>`;
      return;
    }
    kycContainer.innerHTML = data.map(kyc => `
      <div class="application">
        <div class="application-header">
          <div class="reference"><strong>KYC ID</strong><br>${escapeHtml(kyc.id)}</div>
          <div class="status">${escapeHtml(kyc.status || "pending")}</div>
        </div>
        <div class="details">
          <div class="detail"><div class="detail-label">Full Name</div><div class="detail-value">${escapeHtml(kyc.full_name)}</div></div>
          <div class="detail"><div class="detail-label">Document Type</div><div class="detail-value">${escapeHtml(kyc.document_type)}</div></div>
          <div class="detail"><div class="detail-label">Document Number</div><div class="detail-value">${escapeHtml(kyc.document_number)}</div></div>
          <div class="detail"><div class="detail-label">Country of Residence</div><div class="detail-value">${escapeHtml(kyc.country_of_residence)}</div></div>
          <div class="detail"><div class="detail-label">Business Name</div><div class="detail-value">${escapeHtml(kyc.business_name || "—")}</div></div>
          <div class="detail"><div class="detail-label">Submitted</div><div class="detail-value">${formatDate(kyc.created_at)}</div></div>
          <div class="detail" style="grid-column:1 / -1">
            <div class="detail-label">Document</div>
            <div class="detail-value">
              ${kyc.document_url
                ? `<a href="${escapeHtml(kyc.document_url)}" target="_blank" style="color:#0b5cab;font-weight:700;">View uploaded document</a>`
                : "No document uploaded"}
            </div>
          </div>
        </div>
        <div class="review-section">
          <h3>Review KYC</h3>
          <div class="review-row">
            <div>
              <label>Status</label>
              <select id="kyc-status-${kyc.id}">
                <option value="pending" ${kyc.status === "pending" ? "selected" : ""}>Pending</option>
                <option value="approved" ${kyc.status === "approved" ? "selected" : ""}>Approved</option>
                <option value="rejected" ${kyc.status === "rejected" ? "selected" : ""}>Rejected</option>
              </select>
            </div>
          </div>
          <button onclick="updateKYC('${kyc.id}')" id="kyc-btn-${kyc.id}">Save KYC Review</button>
        </div>
      </div>
    `).join("");
  } catch (err) {
    console.error(err);
    kycContainer.innerHTML = `<div class="empty"><p>Could not load KYC submissions.</p></div>`;
  }
}

async function updateKYC(id) {
  const status = document.getElementById(`kyc-status-${id}`).value;
  const button = document.getElementById(`kyc-btn-${id}`);
  button.disabled = true;
  button.textContent = "Saving...";
  try {
    const { error } = await supabaseClient.from("kyc_submissions").update({ status }).eq("id", id);
    if (error) throw error;
    showSuccess("KYC status updated successfully.");
    loadKYC();
  } catch (err) {
    showError("Unable to update KYC: " + err.message);
  } finally {
    button.disabled = false;
    button.textContent = "Save KYC Review";
  }
}

const initialLanguage = getSavedLanguage();
applyAdminLanguage(initialLanguage);
loadAdminApplications();
</script>
</body>
</html>
