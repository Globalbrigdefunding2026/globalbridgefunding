<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Test</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f7fb; }
    .box { background: white; padding: 20px; border-radius: 10px; margin: 10px 0; }
    .error { background: #fee4e2; color: #b42318; }
  </style>
</head>
<body>
  <h1>Admin Test</h1>
  <div id="result" class="box">Starting...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const result = document.getElementById("result");

    function show(msg, isError) {
      result.textContent = msg;
      result.className = isError ? "box error" : "box";
    }

    async function run() {
      try {
        show("Script started");

        if (!window.supabase) {
          show("Supabase library failed to load", true);
          return;
        }

        const supabase = window.supabase.createClient(
          "https://siykgexfdsmkiqwyxker.supabase.co",
          "sb_publishable_z2GEofJ5eZlSk88IVCjLNg_bmjt6xe6"
        );

        show("Checking login...");

        const { data, error } = await supabase.auth.getUser();

        if (error) {
          show("Auth error: " + error.message, true);
          return;
        }

        if (!data.user) {
          show("You are not logged in. Go to login.html first.", true);
          return;
        }

        show("Logged in as: " + data.user.email);

      } catch (err) {
        show("Error: " + err.message, true);
      }
    }

    run();
  </script>
</body>
</html>
