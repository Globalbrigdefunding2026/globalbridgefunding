<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin Applications | GlobalBridgeFunding</title>

  <!-- GlobalBridgeFunding Central Language System -->
  <script src="language.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #0b1f3a;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .admin-label {
      font-size: 13px;
      opacity: 0.8;
    }

    .language-select {
      border: 1px solid rgba(255,255,255,0.35);
      background: white;
      color: #172033;
      border-radius: 7px;
      padding: 7px 9px;
      font-size: 12px;
      outline: none;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .intro {
      color: #667085;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .message {
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      line-height: 1.5;
    }

    .error {
      background: #fee4e2;
      color: #b42318;
    }

    .success {
      background: #dcfae6;
      color: #067647;
    }

    .loading {
      background: white;
      padding: 25px;
      border-radius: 14px;
      text-align: center;
      color: #667085;
    }

    .application {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(16, 24, 40, 0.07);
      border: 1px solid #e6eaf0;
    }

    .application-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .reference {
      font-size: 13px;
      color: #667085;
      word-break: break-all;
    }

    .reference strong {
      color: #172033;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: #fff4cc;
      color: #8a5b00;
      font-size: 13px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .detail {
      background: #f8fafc;
      padding: 14px;
      border-radius: 10px;
    }

    .detail-label {
      font-size: 12px;
      color: #667085;
      margin-bottom: 5px;
    }

    .detail-value {
      font-weight: 600;
      word-break: break-word;
    }

    .review-section {
      border-top: 1px solid #eaecf0;
      padding-top: 20px;
    }

    .review-section h3 {
      font-size: 17px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      padding: 12px;
      font-size: 14px;
      background: white;
      outline: none;
    }

    select:focus,
    textarea:focus {
      border-color: #0b5cab;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      margin-bottom: 12px;
    }

    .review-row {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 15px;
      align-items: end;
    }

    button {
      border: none;
      background: #0b5cab;
      color: white;
      padding: 12px 18px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #084a8d;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .email-status {
      margin-top: 12px;
      font-size: 13px;
      color: #667085;
    }

    .empty {
      background: white;
      padding: 35px;
      border-radius: 14px;
      text-align: center;
      color: #667085;
    }

    .empty h3 {
      margin-bottom: 8px;
      color: #172033;
    }

    /* Persian / RTL */
    html[dir="rtl"] body {
      direction: rtl;
    }

    html[dir="rtl"] .header-inner,
    html[dir="rtl"] .application-header,
    html[dir="rtl"] .review-row {
      direction: rtl;
    }

    html[dir="rtl"] .reference {
      text-align: right;
    }

    @media (max-width: 700px) {

      h1 {
        font-size: 25px;
      }

      .header-inner {
        align-items: flex-start;
      }

      .header-right {
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .review-row {
        grid-template-columns: 1fr;
      }

      .application {
        padding: 18px;
      }

    }
  </style>
</head>

</main>

  /*

    ==========================================================

  function getSavedLanguage() {

    if (
      window.GlobalBridgeLanguage &&
      typeof window.GlobalBridgeLanguage.getLanguage ===
        "function"
    ) {

      return window.GlobalBridgeLanguage.getLanguage();

    }

    const saved =
      localStorage.getItem("globalbridge_language");

    if (
      saved &&
      adminTranslations[saved]
    ) {
      return saved;
    }

    return "en";
  }


  function applyAdminLanguage(language) {

    if (!adminTranslations[language]) {
      language = "en";
    }

    /*
      IMPORTANT:
      We only READ the saved language when
      the page loads.

      We do NOT call setLanguage() here.
      This prevents the admin page from
      accidentally changing the user's
      previously selected language.
    */

    document.documentElement.lang =
      language;

    if (language === "fa") {

      document.documentElement.dir =
        "rtl";

      document.body.classList.add(
        "rtl-language"
      );

    } else {

      document.documentElement.dir =
        "ltr";

      document.body.classList.remove(
        "rtl-language"
      );

    }


    document
      .querySelectorAll("[data-key]")
      .forEach(element => {

        const key =
          element.getAttribute("data-key");

        if (
          adminTranslations[language][key]
        ) {

          element.textContent =
            adminTranslations[language][key];

        }

      });


    if (languageSelector) {

      languageSelector.value =
        language;

    }


    /*
      If applications are already loaded,
      redraw them in the selected language.
    */

    if (
      window.adminApplicationsData
    ) {

      renderApplications(
        window.adminApplicationsData
      );

    }

  }


  if (languageSelector) {

    languageSelector.addEventListener(
      "change",
      function () {

        const selectedLanguage =
          this.value;

        /*
          The user deliberately changed
          the language, so NOW we save it.
        */

        if (
          window.GlobalBridgeLanguage &&
          typeof window.GlobalBridgeLanguage.setLanguage ===
            "function"
        ) {

          window.GlobalBridgeLanguage.setLanguage(
            selectedLanguage
          );

        } else {

          localStorage.setItem(
            "globalbridge_language",
            selectedLanguage
          );

          localStorage.setItem(
            "selectedLanguage",
            selectedLanguage
          );

        }

        applyAdminLanguage(
          selectedLanguage
        );

      }
    );

  }

  /*

  function formatMoney(amount) {

    return new Intl.NumberFormat(
      "en-US",
      {
        style: "currency",
        currency: "USD"
      }
    ).format(amount);

  }


  function formatDate(date) {

    const language =
      getSavedLanguage();

    const localeMap = {

      en: "en-US",
      pt: "pt-PT",
      vi: "vi-VN",
      fa: "fa-IR",
      id: "id-ID",
      fr: "fr-FR",
      fi: "fi-FI",
      es: "es-ES"

    };

    return new Date(date).toLocaleDateString(

      localeMap[language] || "en-US",

      {
        year: "numeric",
        month: "long",
        day: "numeric"
      }

    );

  }


  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }

    return String(value)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  function translateStatus(status) {

    const language =
      getSavedLanguage();

    const translations =
      adminTranslations[language] ||
      adminTranslations.en;

    return translations[status] ||
      status;

  }

  /*
    ==========================================================
    LOAD ADMIN APPLICATIONS
    ==========================================================
  */

  async function loadAdminApplications() {

    try {

      const {

        data: {
          user
        },

        error: userError

      } =
        await supabaseClient.auth.getUser();


      if (
        userError ||
        !user
      ) {

        window.location.href =
          "login.html";

        return;

      }


      /*
        Confirm administrator access.
      */

      const {

        data: adminRecord,

        error: adminError

      } =
        await supabaseClient

          .from("admin_users")

          .select("user_id")

          .eq("user_id", user.id)

          .maybeSingle();


      if (adminError) {

        showError(
          adminTranslations[
            getSavedLanguage()
          ].unableVerify
        );

        loading.style.display =
          "none";

        return;

      }


      if (!adminRecord) {

        showError(
          adminTranslations[
            getSavedLanguage()
          ].accessDenied
        );

        loading.style.display =
          "none";

        return;

      }


      /*
        Load all financing applications.
      */

      const {

        data: applications,

        error: applicationsError

      } =
        await supabaseClient

          .from("financing_applications")

          .select("*")

          .order("created_at", {
            ascending: false
          });


      if (applicationsError) {

        showError(
          adminTranslations[
            getSavedLanguage()
          ].unableLoad +
          applicationsError.message
        );

        loading.style.display =
          "none";

        return;

      }


      loading.style.display =
        "none";


      /*
        Store applications globally so
        changing language can redraw them
        without querying Supabase again.
      */

      window.adminApplicationsData =
        applications || [];


      renderApplications(
        window.adminApplicationsData
      );

    }


    catch (error) {

      loading.style.display =
        "none";

      showError(
        adminTranslations[
          getSavedLanguage()
        ].somethingWrong
      );

      console.error(error);

    }

  }


  /*
    ==========================================================
    UPDATE APPLICATION
    ==========================================================
  */

  async function updateApplication(
    applicationId
  ) {


    const statusElement =
      document.getElementById(
        "status-" + applicationId
      );


    const noteElement =
      document.getElementById(
        "note-" + applicationId
      );


    const button =
      document.getElementById(
        "button-" + applicationId
      );


    const emailStatus =
      document.getElementById(
        "email-status-" + applicationId
      );


    const status =
      statusElement.value;


    const note =
      noteElement.value.trim();


    /*
      The note is intentionally retained
      in the interface for future internal
      review-note functionality.

      Existing database behavior is preserved.
    */

    void note;


    const translations =
      adminTranslations[
        getSavedLanguage()
      ] || adminTranslations.en;


    button.disabled =
      true;

    button.textContent =
      translations.saving;

    emailStatus.textContent =
      "";


    try {


      /*
        Confirm the current logged-in user.
      */

      const {

        data: {
          user
        },

        error: userError

      } =
        await supabaseClient.auth.getUser();


      if (
        userError ||
        !user
      ) {

        window.location.href =
          "login.html";

        return;

      }


      /*
        Verify administrator permission.
      */

      const {

        data: adminRecord,

        error: adminError

      } =
        await supabaseClient

          .from("admin_users")

          .select("user_id")

          .eq("user_id", user.id)

          .maybeSingle();


      if (
        adminError ||
        !adminRecord
      ) {

        throw new Error(
          translations.unauthorizedUpdate
        );

      }


      /*
        Get the application's current status
        BEFORE changing it.

        This existing security/workflow logic
        is preserved.
      */

      const {

        data: currentApplication,

        error: currentApplicationError

      } =
        await supabaseClient

          .from("financing_applications")

          .select("status")

          .eq("id", applicationId)

          .single();


      if (
        currentApplicationError ||
        !currentApplication
      ) {

        throw new Error(
          translations.unableCurrentStatus
        );

      }


      const wasAlreadyApproved =
        currentApplication.status ===
        "approved";


      /*
        Update application status.
      */

      const {

        error: updateError

      } =
        await supabaseClient

          .from("financing_applications")

          .update({

            status: status

          })

          .eq("id", applicationId);


      if (updateError) {

        throw updateError;

      }


      /*
        If the application has just become
        approved, send the existing Persian
        approval email through hyper-worker.

        DO NOT CHANGE THIS FUNCTION.
      */

      if (
        status === "approved" &&
        !wasAlreadyApproved
      ) {


        emailStatus.textContent =
          translations.approvedSending;


        const {

          data: emailData,

          error: emailError

        } =
          await supabaseClient.functions.invoke(

            "hyper-worker",

            {

              body: {

                action: "approval_email",

                application_id:
                  applicationId

              }

            }

          );


        if (emailError) {

          console.error(
            "Approval email error:",
            emailError
          );

          throw new Error(
            translations.approvedEmailFailed
          );

        }


        if (
          emailData &&
          emailData.error
        ) {

          throw new Error(
            emailData.error
          );

        }


        emailStatus.textContent =
          translations.emailSent;


        showSuccess(
          translations.approvedEmailSuccess
        );


      } else if (
        status === "approved" &&
        wasAlreadyApproved
      ) {


        showSuccess(
          translations.alreadyApproved
        );


      } else {


        showSuccess(
          translations.statusUpdated
        );

      }


      button.disabled =
        false;

      button.textContent =
        translations.saveReview;


      /*
        Refresh the application list.
      */

      setTimeout(() => {

        loadAdminApplications();

      }, 800);


    }


    catch (error) {

      console.error(error);


      showError(
        translations.unableUpdate +
        error.message
      );


      button.disabled =
        false;

      button.textContent =
        translations.saveReview;

    }

  }


  /*
    ==========================================================

    IMPORTANT:
    We READ the existing language.

    ==========================================================
  */

  const initialLanguage =

  applyAdminLanguage(

  );


  /*
