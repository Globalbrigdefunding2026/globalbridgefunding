<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin Applications | GlobalBridgeFunding</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #0b1f3a;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
    }

    .admin-label {
      font-size: 13px;
      opacity: 0.8;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .intro {
      color: #667085;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .message {
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      line-height: 1.5;
    }

    .error {
      background: #fee4e2;
      color: #b42318;
    }

    .success {
      background: #dcfae6;
      color: #067647;
    }

    .loading {
      background: white;
      padding: 25px;
      border-radius: 14px;
      text-align: center;
      color: #667085;
    }

    .application {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(16, 24, 40, 0.07);
      border: 1px solid #e6eaf0;
    }

    .application-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .reference {
      font-size: 13px;
      color: #667085;
      word-break: break-all;
    }

    .reference strong {
      color: #172033;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: #fff4cc;
      color: #8a5b00;
      font-size: 13px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .detail {
      background: #f8fafc;
      padding: 14px;
      border-radius: 10px;
    }

    .detail-label {
      font-size: 12px;
      color: #667085;
      margin-bottom: 5px;
    }

    .detail-value {
      font-weight: 600;
      word-break: break-word;
    }

    .review-section {
      border-top: 1px solid #eaecf0;
      padding-top: 20px;
    }

    .review-section h3 {
      font-size: 17px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      padding: 12px;
      font-size: 14px;
      background: white;
      outline: none;
    }

    select:focus,
    textarea:focus {
      border-color: #0b5cab;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      margin-bottom: 12px;
    }

    .review-row {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 15px;
      align-items: end;
    }

    button {
      border: none;
      background: #0b5cab;
      color: white;
      padding: 12px 18px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #084a8d;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .empty {
      background: white;
      padding: 35px;
      border-radius: 14px;
      text-align: center;
      color: #667085;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 25px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .review-row {
        grid-template-columns: 1fr;
      }

      .application {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">GlobalBridgeFunding</div>
    <div class="admin-label">Administrator Portal</div>
  </div>
</header>

<main>

  <h1>Application Review</h1>

  <p class="intro">
    Review submitted financing applications and update their current status.
  </p>

  <div id="errorMessage" class="message error"></div>
  <div id="successMessage" class="message success"></div>

  <div id="loading" class="loading">
    Checking administrator access...
  </div>

  <div id="applications"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://siykgexfdsmkiqwyxker.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_z2GEofJ5eZlSk88IVCjLNg_bmjt6xe6";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const loading = document.getElementById("loading");
  const applicationsContainer =
    document.getElementById("applications");

  const errorMessage =
    document.getElementById("errorMessage");

  const successMessage =
    document.getElementById("successMessage");


  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = "block";
    successMessage.style.display = "none";
  }


  function showSuccess(message) {
    successMessage.textContent = message;
    successMessage.style.display = "block";
    errorMessage.style.display = "none";

    setTimeout(() => {
      successMessage.style.display = "none";
    }, 4000);
  }


  function formatMoney(amount) {
    return new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD"
    }).format(amount);
  }


  function formatDate(date) {
    return new Date(date).toLocaleDateString(
      "en-US",
      {
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    );
  }


  function escapeHtml(value) {
    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  async function loadAdminApplications() {

    try {

      const {
        data: {
          user
        },
        error: userError
      } = await supabaseClient.auth.getUser();


      if (userError || !user) {
        window.location.href = "login.html";
        return;
      }


      /*
        Confirm that the logged-in account
        exists in the admin_users table.
      */

      const {
        data: adminRecord,
        error: adminError
      } = await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();


      if (adminError) {
        showError(
          "Unable to verify administrator access."
        );

        loading.style.display = "none";
        return;
      }


      if (!adminRecord) {
        showError(
          "Access denied. This account is not authorized as an administrator."
        );

        loading.style.display = "none";
        return;
      }


      /*
        Load all financing applications.
      */

      const {
        data: applications,
        error: applicationsError
      } = await supabaseClient
        .from("financing_applications")
        .select("*")
        .order("created_at", {
          ascending: false
        });


      if (applicationsError) {
        showError(
          "Unable to load applications: " +
          applicationsError.message
        );

        loading.style.display = "none";
        return;
      }


      loading.style.display = "none";


      if (!applications || applications.length === 0) {

        applicationsContainer.innerHTML = `
          <div class="empty">
            <h3>No applications found</h3>
            <p>There are currently no financing applications to review.</p>
          </div>
        `;

        return;
      }


      applicationsContainer.innerHTML =
        applications.map(application => {

          return `
            <div class="application">

              <div class="application-header">

                <div class="reference">
                  <strong>Application Reference</strong><br>
                  ${escapeHtml(application.id)}
                </div>

                <div class="status">
                  ${escapeHtml(application.status)}
                </div>

              </div>


              <div class="details">

                <div class="detail">
                  <div class="detail-label">
                    Requested Financing
                  </div>

                  <div class="detail-value">
                    ${formatMoney(application.requested_amount)}
                  </div>
                </div>


                <div class="detail">
                  <div class="detail-label">
                    Business Name
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(application.business_name)}
                  </div>
                </div>


                <div class="detail">
                  <div class="detail-label">
                    Business Type
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(application.business_type)}
                  </div>
                </div>


                <div class="detail">
                  <div class="detail-label">
                    Years in Operation
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(application.years_in_operation)}
                  </div>
                </div>


                <div class="detail">
                  <div class="detail-label">
                    Estimated Annual Revenue
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(application.annual_revenue)}
                  </div>
                </div>


                <div class="detail">
                  <div class="detail-label">
                    Submitted
                  </div>

                  <div class="detail-value">
                    ${formatDate(application.created_at)}
                  </div>
                </div>


                <div class="detail" style="grid-column: 1 / -1;">
                  <div class="detail-label">
                    Financing Purpose
                  </div>

                  <div class="detail-value">
                    ${escapeHtml(application.financing_purpose)}
                  </div>
                </div>

              </div>


              <div class="review-section">

                <h3>Review Application</h3>

                <div class="review-row">

                  <div>

                    <label for="status-${application.id}">
                      Application Status
                    </label>

                    <select id="status-${application.id}">

                      <option value="pending"
                        ${application.status === "pending" ? "selected" : ""}>
                        Pending
                      </option>

                      <option value="under_review"
                        ${application.status === "under_review" ? "selected" : ""}>
                        Under Review
                      </option>

                      <option value="approved"
                        ${application.status === "approved" ? "selected" : ""}>
                        Approved
                      </option>

                      <option value="rejected"
                        ${application.status === "rejected" ? "selected" : ""}>
                        Rejected
                      </option>

                    </select>

                  </div>


                  <div>

                    <label for="note-${application.id}">
                      Review Note
                    </label>

                    <textarea
                      id="note-${application.id}"
                      placeholder="Add an internal review note..."
                    ></textarea>

                  </div>

                </div>


                <button
                  onclick="updateApplication('${application.id}')"
                  id="button-${application.id}"
                >
                  Save Review
                </button>

              </div>

            </div>
          `;

        }).join("");

    } catch (error) {

      loading.style.display = "none";

      showError(
        "Something went wrong while loading the admin page."
      );

      console.error(error);
    }
  }


  async function updateApplication(applicationId) {

    const statusElement =
      document.getElementById(
        "status-" + applicationId
      );

    const noteElement =
      document.getElementById(
        "note-" + applicationId
      );

    const button =
      document.getElementById(
        "button-" + applicationId
      );


    const status =
      statusElement.value;

    const note =
      noteElement.value.trim();


    button.disabled = true;
    button.textContent = "Saving...";


    try {

      const {
        data: {
          user
        }
      } = await supabaseClient.auth.getUser();


      if (!user) {
        window.location.href = "login.html";
        return;
      }


      /*
        Verify administrator permission again
        before changing the application.
      */

      const {
        data: adminRecord,
        error: adminError
      } = await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();


      if (adminError || !adminRecord) {

        showError(
          "You are not authorized to update applications."
        );

        button.disabled = false;
        button.textContent = "Save Review";

        return;
      }


      /*
        Update application status.

        Review notes are only included if the
        database contains a review_note column.
      */

      const {
        error
      } = await supabaseClient
        .from("financing_applications")
        .update({
          status: status
        })
        .eq("id", applicationId);


      if (error) {
        throw error;
      }


      showSuccess(
        "Application status updated successfully."
      );


      button.disabled = false;
      button.textContent = "Save Review";


      /*
        Refresh the application list so the
        new status is displayed.
      */

      setTimeout(() => {
        loadAdminApplications();
      }, 500);


    } catch (error) {

      console.error(error);

      showError(
        "Unable to update application: " +
        error.message
      );

      button.disabled = false;
      button.textContent = "Save Review";
    }
  }


  loadAdminApplications();
</script>

</body>
</html>
