<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Applications</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f7fb; }
    .box { background: white; padding: 16px; border-radius: 10px; margin: 10px 0; }
    .error { background: #fee4e2; color: #b42318; }
  </style>
</head>
<body>
  <h1>Admin Applications</h1>
  <div id="log" class="box">Starting...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const log = document.getElementById("log");
    function add(msg, isError) {
      const div = document.createElement("div");
      div.className = isError ? "box error" : "box";
      div.textContent = msg;
      log.appendChild(div);
    }

    const supabase = window.supabase.createClient(
      "https://siykgexfdsmkiqwyxker.supabase.co",
      "sb_publishable_z2GEofJ5eZlSk88IVCjLNg_bmjt6xe6"
    );

    async function test() {
      add("Checking login...");
      const { data: { user }, error: userErr } = await supabase.auth.getUser();
      if (userErr || !user) { add("Not logged in", true); return; }
      add("Logged in as: " + user.email);

      add("Loading financing_applications...");
      const { data: apps, error: appErr } = await supabase.from("financing_applications").select("*").limit(5);
      if (appErr) add("Applications error: " + appErr.message, true);
      else add("Applications found: " + (apps?.length || 0));

      add("Loading kyc_submissions...");
      const { data: kyc, error: kycErr } = await supabase.from("kyc_submissions").select("*").limit(5);
      if (kycErr) add("KYC error: " + kycErr.message, true);
      else add("KYC found: " + (kyc?.length || 0));

      add("Done.");
    }

    test();
  </script>
</body>
</html>
