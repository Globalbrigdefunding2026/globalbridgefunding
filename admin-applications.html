<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Applications | GlobalBridgeFunding</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fb; color: #172033; padding: 20px; }
    .error { background: #fee4e2; color: #b42318; padding: 14px; border-radius: 8px; margin: 10px 0; }
    .loading { background: white; padding: 20px; border-radius: 10px; text-align: center; }
    button { background: #0b5cab; color: white; border: none; padding: 10px 16px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Admin Applications</h1>
  <div id="status" class="loading">Loading...</div>
  <div id="errorBox" class="error" style="display:none;"></div>
  <div id="content"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://siykgexfdsmkiqwyxker.supabase.co";
    const SUPABASE_KEY = "sb_publishable_z2GEofJ5eZlSk88IVCjLNg_bmjt6xe6";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const statusEl = document.getElementById("status");
    const errorBox = document.getElementById("errorBox");
    const content = document.getElementById("content");

    function showError(msg) {
      statusEl.style.display = "none";
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }

    async function init() {
      try {
        statusEl.textContent = "Checking login...";
        const { data: { user }, error: userError } = await supabase.auth.getUser();
        
        if (userError) throw new Error("Auth error: " + userError.message);
        if (!user) {
          showError("Not logged in. Please log in first.");
          return;
        }

        statusEl.textContent = "Checking admin access...";
        const { data: admin, error: adminError } = await supabase
          .from("admin_users")
          .select("user_id")
          .eq("user_id", user.id)
          .maybeSingle();

        if (adminError) throw new Error("Admin check error: " + adminError.message);
        if (!admin) {
          showError("Access denied. This account is not an administrator.");
          return;
        }

        statusEl.style.display = "none";
        content.innerHTML = "<p>Admin access confirmed. Loading data...</p>";

        // Load applications
        const { data: apps, error: appsError } = await supabase
          .from("financing_applications")
          .select("id, business_name, status, requested_amount")
          .limit(10);

        if (appsError) throw new Error("Applications error: " + appsError.message);

        content.innerHTML += `<p>Found ${apps?.length || 0} applications.</p>`;

        // Load KYC
        const { data: kyc, error: kycError } = await supabase
          .from("kyc_submissions")
          .select("id, full_name, status")
          .limit(10);

        if (kycError) throw new Error("KYC error: " + kycError.message);

        content.innerHTML += `<p>Found ${kyc?.length || 0} KYC records.</p>`;
        content.innerHTML += `<p style="color:green;">Basic checks passed. The full page can now be restored.</p>`;

      } catch (err) {
        console.error(err);
        showError(err.message || "Unknown error");
      }
    }

    init();
  </script>
</body>
</html>
