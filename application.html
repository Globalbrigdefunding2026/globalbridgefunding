<!DOCTYPE html>

<html lang="en" dir="ltr">

<head>

  <meta charset="UTF-8">

  <title>My Applications | GlobalBridgeFunding</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      font-family: Arial, Helvetica, sans-serif;

      background: #f4f7fb;

      color: #172033;

    }

    header {

      background: #071a35;

      color: white;

      padding: 17px 5%;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 14px;

      flex-wrap: wrap;

    }

    .logo {

      color: white;

      font-size: 20px;

      font-weight: 800;

      text-decoration: none;

    }

    .logo span { color: #36c2ff; }

    .header-actions {

      display: flex;

      align-items: center;

      gap: 12px;

      flex-wrap: wrap;

    }

    .language-selector {

      padding: 9px;

      border-radius: 7px;

      border: 1px solid #cbd5e1;

      background: white;

      color: #071a35;

      font-size: 14px;

      max-width: 150px;

    }

    .back-link {

      color: white;

      text-decoration: none;

      font-size: 14px;

    }

    .back-link:hover { text-decoration: underline; }

    main {

      width: min(100% - 32px, 900px);

      margin: 35px auto;

      min-height: 55vh;

    }

    .page-heading { margin-bottom: 24px; }

    h1 {

      margin: 0 0 10px;

      font-size: clamp(25px, 5vw, 34px);

      color: #071a35;

    }

    .subtitle {

      color: #667085;

      line-height: 1.6;

      margin: 0;

    }

    .toolbar {

      display: flex;

      gap: 12px;

      flex-wrap: wrap;

      margin: 20px 0;

    }

    /* Primary New Application button */

    .button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      border: 0;

      border-radius: 8px;

      padding: 12px 17px;

      background: #36c2ff;

      color: #071a35;

      font-weight: 700;

      font-size: 14px;

      text-decoration: none;

      cursor: pointer;

      transition: background .2s ease, transform .2s ease;

    }

    .button:not(.secondary):hover {

      background: #19a9ed;

      color: #071a35;

      transform: translateY(-1px);

    }

    .button.secondary {

      background: white;

      border: 1px solid #d6dee9;

      color: #071a35;

    }

    .button.secondary:hover {

      background: #edf4fb;

    }

    .button:focus-visible,

    select:focus-visible,

    a:focus-visible {

      outline: 3px solid #36c2ff;

      outline-offset: 3px;

    }

    .button:disabled {

      opacity: .6;

      cursor: not-allowed;

    }

    #message {

      background: white;

      border: 1px solid #e0e7f0;

      border-radius: 12px;

      padding: 22px;

      color: #667085;

      line-height: 1.6;

    }

    .application-card {

      background: white;

      border: 1px solid #e3eaf3;

      border-radius: 13px;

      padding: 22px;

      margin-bottom: 16px;

      box-shadow: 0 5px 18px rgba(20, 40, 70, .04);

      overflow-wrap: anywhere;

    }

    .application-top {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 12px;

      flex-wrap: wrap;

      margin-bottom: 16px;

    }

    .application-top h2 {

      margin: 0;

      font-size: 19px;

      color: #071a35;

    }

    .reference {

      color: #7b8797;

      font-size: 12px;

      margin-top: 7px;

      overflow-wrap: anywhere;

    }

    .status {

      display: inline-block;

      border-radius: 20px;

      padding: 7px 11px;

      font-size: 12px;

      font-weight: 700;

      background: #edf2f7;

      color: #344054;

    }

    .status.pending { background: #fff4d6; color: #8a5b00; }

    .status.approved { background: #dcfce7; color: #166534; }

    .status.rejected { background: #fee2e2; color: #991b1b; }

    .details {

      display: grid;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 18px;

    }

    .detail-label {

      display: block;

      color: #667085;

      font-size: 13px;

      margin-bottom: 6px;

    }

    .detail-value {

      color: #172033;

      font-size: 15px;

      font-weight: 700;

      overflow-wrap: anywhere;

    }

    footer {

      text-align: center;

      color: #7b8797;

      font-size: 12px;

      padding: 25px 16px;

    }

    html[dir="rtl"] body { text-align: right; }

    @media (max-width: 520px) {

      header { padding: 15px 16px; }

      .logo { font-size: 18px; }

      main { margin-top: 25px; }

      .details { grid-template-columns: 1fr; gap: 15px; }

      .application-card { padding: 17px; }

      .header-actions { gap: 9px; }

      .language-selector { max-width: 135px; }

    }

  </style>

</head>

    const localeByLanguage = {

      en: "en-US",

      pt: "pt-PT",

      vi: "vi-VN",

      fa: "fa-IR",

      id: "id-ID",

      fr: "fr-FR",

      fi: "fi-FI",

      es: "es-ES"

    };

    const languageSelector = document.getElementById("languageSelector");

    const message = document.getElementById("message");

    const applicationsList = document.getElementById("applicationsList");

    const refreshButton = document.getElementById("refreshButton");

    let currentApplications = [];

    let currentLanguage = "en";

    let loading = false;

    function getSavedLanguage() {

      let saved = "en";

      try {

        if (

          window.GlobalBridgeLanguage &&

          typeof window.GlobalBridgeLanguage.getLanguage === "function"

        ) {

          saved = window.GlobalBridgeLanguage.getLanguage();

        } else {

          saved =

            localStorage.getItem("globalbridge_language") ||

            localStorage.getItem("selectedLanguage") ||

            "en";

        }

      } catch (_) {}

      return translations[saved] ? saved : "en";

    }

    function t(key) {

      return translations[currentLanguage][key] ??

        translations.en[key] ??

        key;

    }

    function setText(element, text) {

      element.textContent =

        text === null || text === undefined || text === ""

          ? "—"

          : String(text);

    }

    function applyLanguage(language) {

      currentLanguage = translations[language] ? language : "en";

      document.documentElement.lang = currentLanguage;

      document.documentElement.dir =

        currentLanguage === "fa" ? "rtl" : "ltr";

      languageSelector.value = currentLanguage;

      document.querySelectorAll("[data-key]").forEach(element => {

        const key = element.getAttribute("data-key");

        if (translations[currentLanguage][key] !== undefined) {

          element.textContent = translations[currentLanguage][key];

        }

      });

      renderApplications();

      if (loading) {

        message.hidden = false;

        setText(message, t("loading"));

      }

    }

    function selectLanguage(language) {

      language = translations[language] ? language : "en";

      try {

        localStorage.setItem("globalbridge_language", language);

        localStorage.setItem("selectedLanguage", language);

      } catch (_) {}

      if (

        window.GlobalBridgeLanguage &&

        typeof window.GlobalBridgeLanguage.setLanguage === "function"

      ) {

        window.GlobalBridgeLanguage.setLanguage(language);

      }

      applyLanguage(language);

    }

    languageSelector.addEventListener("change", () => {

      selectLanguage(languageSelector.value);

    });

    function makeDetail(label, value) {

      const wrapper = document.createElement("div");

      const labelElement = document.createElement("span");

      labelElement.className = "detail-label";

      setText(labelElement, label);

      const valueElement = document.createElement("div");

      valueElement.className = "detail-value";

      setText(valueElement, value);

      wrapper.append(labelElement, valueElement);

      return wrapper;

    }

    function formatAmount(amount) {

      if (amount === null || amount === undefined || amount === "") {

        return "—";

      }

      const numeric = Number(amount);

      if (!Number.isFinite(numeric)) return String(amount);

      return new Intl.NumberFormat(localeByLanguage[currentLanguage], {

        style: "currency",

        currency: "USD",

        maximumFractionDigits: 2

      }).format(numeric);

    }

    function formatDate(dateValue) {

      if (!dateValue) return "—";

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) return String(dateValue);

      return new Intl.DateTimeFormat(localeByLanguage[currentLanguage], {

        year: "numeric",

        month: "short",

        day: "numeric"

      }).format(date);

    }

    function translatedStatus(status) {

      const normalized = String(status || "").trim().toLowerCase();

      if (normalized === "pending" || normalized === "under review") {

        return { label: t("pending"), css: "pending" };

      }

      if (normalized === "approved") {

        return { label: t("approved"), css: "approved" };

      }

      if (normalized === "rejected" || normalized === "declined") {

        return { label: t("rejected"), css: "rejected" };

      }

      return {

        label: status || t("otherStatus"),

        css: ""

      };

    }

    function renderApplications() {

      applicationsList.replaceChildren();

      if (!currentApplications.length) return;

      currentApplications.forEach(application => {

        const card = document.createElement("article");

        card.className = "application-card";

        const top = document.createElement("div");

        top.className = "application-top";

        const headingWrap = document.createElement("div");

        const heading = document.createElement("h2");

        setText(

          heading,

          application.business_name || t("newApplication")

        );

        const reference = document.createElement("div");

        reference.className = "reference";

        setText(

          reference,

          t("reference") + ": " + (application.id || "—")

        );

        headingWrap.append(heading, reference);

        const status = translatedStatus(application.status);

        const badge = document.createElement("span");

        badge.className = "status " + status.css;

        setText(badge, status.label);

        top.append(headingWrap, badge);

        const details = document.createElement("div");

        details.className = "details";

        details.append(

          makeDetail(t("amount"), formatAmount(application.requested_amount)),

          makeDetail(t("businessType"), application.business_type),

          makeDetail(t("submitted"), formatDate(application.created_at)),

          makeDetail(t("status"), status.label)

        );

        card.append(top, details);

        applicationsList.append(card);

      });

    }

    async function loadApplications() {

      if (loading) return;

      loading = true;

      refreshButton.disabled = true;

      message.hidden = false;

      setText(message, t("loading"));

      applicationsList.replaceChildren();

      try {

        const { data: authData, error: authError } =

          await supabaseClient.auth.getUser();

        if (authError || !authData || !authData.user) {

          window.location.replace("login.html");

          return;

        }

        const user = authData.user;

        const { data, error } = await supabaseClient

          .from("financing_applications")

          .select("*")

          .eq("user_id", user.id)

          .order("created_at", { ascending: false });

        if (error) {

          console.error("Application loading error:", error);

          currentApplications = [];

          setText(message, t("loadError"));

          return;

        }

        currentApplications = Array.isArray(data) ? data : [];

        renderApplications();

        if (currentApplications.length === 0) {

          setText(message, t("empty"));

          message.hidden = false;

        } else {

          message.hidden = true;

        }

      } catch (error) {

        console.error("Unexpected application loading error:", error);

        currentApplications = [];

        setText(message, t("loadError"));

        message.hidden = false;

      } finally {

        loading = false;

        refreshButton.disabled = false;

      }

    }

    refreshButton.addEventListener("click", loadApplications);

    selectLanguage(getSavedLanguage());

    loadApplications();

  </script>
