<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f8fc;color:#172033}
header{background:#071a35;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:21px;font-weight:800}
.logo span{color:#36c2ff}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#language{padding:10px;border-radius:7px;border:1px solid #64748b;background:white;color:#071a35;font-size:14px;max-width:180px}
.back,.new-app{color:white;text-decoration:none;font-size:14px;border:1px solid #ffffff66;padding:10px 13px;border-radius:7px;white-space:nowrap}
.new-app{background:#36c2ff;color:#071a35;border-color:#36c2ff;font-weight:700}
.container{max-width:900px;margin:32px auto;padding:0 18px}
h1{color:#071a35;font-size:30px;margin-bottom:8px}
.intro{color:#667085;line-height:1.6;margin-bottom:24px}
.application-card{background:white;border-radius:15px;padding:25px;margin-bottom:20px;box-shadow:0 8px 28px #14284614}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.reference{font-size:12px;color:#667085}
.reference strong{display:block;color:#071a35;font-size:14px;margin-top:4px;word-break:break-all}
.status{padding:8px 13px;border-radius:20px;background:#fff7ed;color:#c2410c;font-size:13px;font-weight:700;white-space:nowrap}
.status.approved{background:#eaf8ef;color:#176534}
.status.declined,.status.rejected{background:#fff1f1;color:#a42626}
.status.reviewing,.status.pending{background:#fff7ed;color:#c2410c}
.details{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.detail{background:#f8fafc;padding:14px;border-radius:8px;min-width:0}
.detail span{display:block;color:#667085;font-size:12px;margin-bottom:5px}
.detail strong{color:#071a35;font-size:15px;overflow-wrap:anywhere}
.empty{background:white;border-radius:15px;padding:40px 25px;text-align:center;color:#667085;box-shadow:0 8px 28px #14284614}
.empty h2{color:#071a35;margin-bottom:10px}
.empty p{line-height:1.6;margin-bottom:20px}
.loading{text-align:center;padding:35px;color:#667085}
.error{background:#fef3f2;border:1px solid #fecdca;color:#b42318;padding:15px;border-radius:8px;margin-bottom:20px;display:none;line-height:1.6;overflow-wrap:anywhere}
footer{text-align:center;padding:30px 18px;color:#7b8797;font-size:12px}
[dir="rtl"] .detail,[dir="rtl"] .reference{text-align:right}
[dir="rtl"] .status{direction:rtl}
@media(max-width:600px){
 header{padding:15px 18px}
 .logo{font-size:18px}
 .header-right{width:100%}
 #language{flex:1;max-width:none}
 .back,.new-app{font-size:12px;padding:9px}
 .container{margin-top:24px}
 h1{font-size:26px}
 .application-card{padding:20px}
 .top{align-items:flex-start;flex-direction:column}
 .details{grid-template-columns:1fr}
}
</style>

submitted:"Fecha de envío",emptyTitle:"Todavía no hay solicitudes",
emptyText:"Aún no ha enviado ninguna solicitud de financiación.",
startApplication:"Enviar una solicitud",pending:"Pendiente",approved:"Aprobada",

const languageSelect = document.getElementById("language");
const applicationsContainer = document.getElementById("applications");
const errorMessage = document.getElementById("errorMessage");
let currentLanguage = "en";
let applicationsData = [];
function t(key){
  return (translations[currentLanguage] && translations[currentLanguage][key]) ||
    translations.en[key] || key;
}
function escapeHTML(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, function(char){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char];
  });
}
function getStatusKey(status){
  const value = String(status || "pending").toLowerCase().trim();
  if(value === "approved" || value === "approve") return "approved";
  if(value === "declined" || value === "decline") return "declined";
  if(value === "rejected" || value === "reject") return "rejected";
  if(value === "under_review" || value === "under review" || value === "reviewing") return "underReview";
  if(value === "processing" || value === "in_progress") return "processing";
  return "pending";
}
function formatAmount(value){
  const number = Number(value);
  if(!Number.isFinite(number)) return escapeHTML(value);
  return "$" + number.toLocaleString(currentLanguage === "fa" ? "fa-IR" :
    currentLanguage === "pt" ? "pt-PT" :
    currentLanguage === "vi" ? "vi-VN" :
    currentLanguage === "id" ? "id-ID" :
    currentLanguage === "fr" ? "fr-FR" :
    currentLanguage === "fi" ? "fi-FI" :
    currentLanguage === "es" ? "es-ES" : "en-US", {
      minimumFractionDigits:2, maximumFractionDigits:2
    });
}
function formatDate(value){
  if(!value) return "—";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "—";
  const locales = {
    en:"en-US",pt:"pt-PT",vi:"vi-VN",fa:"fa-IR",
    id:"id-ID",fr:"fr-FR",fi:"fi-FI",es:"es-ES"
  };
  return date.toLocaleDateString(locales[currentLanguage] || "en-US", {
    year:"numeric",month:"long",day:"numeric"
  });
}
function renderApplications(){
  errorMessage.style.display = "none";
  if(!applicationsData.length){
    applicationsContainer.innerHTML = `
      <div class="empty">
        <h2>${escapeHTML(t("emptyTitle"))}</h2>
        <p>${escapeHTML(t("emptyText"))}</p>
        <a href="application.html" class="new-app">${escapeHTML(t("startApplication"))}</a>
      </div>`;
    return;
  }
  applicationsContainer.innerHTML = applicationsData.map(function(application){
    const statusKey = getStatusKey(application.status);
    const statusClass = statusKey === "underReview" ? "reviewing" : statusKey;
    return `
      <div class="application-card">
        <div class="top">
          <div class="reference">
            ${escapeHTML(t("reference"))}
            <strong>${escapeHTML(application.id || "—")}</strong>
          </div>
          <div class="status ${escapeHTML(statusClass)}">
            ${escapeHTML(t(statusKey))}
          </div>
        </div>
        <div class="details">
          <div class="detail">
            <span>${escapeHTML(t("amount"))}</span>
            <strong>${formatAmount(application.requested_amount)}</strong>
          </div>
          <div class="detail">
            <span>${escapeHTML(t("businessName"))}</span>
            <strong>${escapeHTML(application.business_name || "—")}</strong>
          </div>
          <div class="detail">
            <span>${escapeHTML(t("businessType"))}</span>
            <strong>${escapeHTML(application.business_type || "—")}</strong>
          </div>
          <div class="detail">
            <span>${escapeHTML(t("submitted"))}</span>
            <strong>${escapeHTML(formatDate(application.created_at))}</strong>
          </div>
        </div>
      </div>`;
  }).join("");
}
function applyLanguage(language){
  currentLanguage = translations[language] ? language : "en";
  document.documentElement.lang = currentLanguage;
  document.documentElement.dir = currentLanguage === "fa" ? "rtl" : "ltr";
  document.title = t("title") + " | GlobalBridgeFunding";
  document.querySelectorAll("[data-i18n]").forEach(function(element){
    const key = element.getAttribute("data-i18n");
    element.textContent = t(key);
  });
  languageSelect.value = currentLanguage;
  renderApplications();
}
function saveLanguage(language){
  try{
    localStorage.setItem("globalbridge_language", language);
  }catch(error){}
}
try{
  const savedLanguage = localStorage.getItem("globalbridge_language");
  if(savedLanguage && translations[savedLanguage]){
    currentLanguage = savedLanguage;
  }
}catch(error){}
languageSelect.value = currentLanguage;
languageSelect.addEventListener("change", function(){
  saveLanguage(this.value);
  applyLanguage(this.value);
});
applyLanguage(currentLanguage);
async function loadApplications(){
  applicationsContainer.innerHTML =
    '<div class="loading">' + escapeHTML(t("loading")) + '</div>';
  try{
    const {data: userData, error: userError} =
      await supabaseClient.auth.getUser();
    if(userError || !userData.user){
      window.location.href = "login.html";
      return;
    }
    const {data, error} = await supabaseClient
      .from("financing_applications")
      .select("*")
      .eq("user_id", userData.user.id)
      .order("created_at", {ascending:false});
    if(error){
      console.error("Application loading error:", error);
      throw new Error(t("errorLoad"));
    }
    applicationsData = data || [];
    renderApplications();
  }catch(error){
    console.error(error);
    applicationsContainer.innerHTML = "";
    errorMessage.textContent = error.message || t("errorGeneral");
    errorMessage.style.display = "block";
  }
}
loadApplications();
})();
